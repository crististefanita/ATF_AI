# Agent runtime values for the current ATF package.
# Project-local paths are relative to the test-framework root.
# Keep this file small: runtime knobs, prompt routing, shared roots, generated-code bindings.
# Artifact details are owned by execute-and-understand-run.html and reporting.html.

# Quality-control knobs
# RUN_EXPECTED_DELTA_QUALITY is a 0-100 threshold for candidate/html-ex quality.
RUN_EXPECTED_DELTA_QUALITY    = 95
ROUND_TARGET_TEST_COUNT       = 5
META_ITERATION_COUNT          = 5

# Prompt family root
PROMPT_ROOT                   = docs/prompts/html_ro

# Prompt routing
# Flow: orchestrate -> pretraining -> UI adapter -> execute -> reporting.
# Graph and score are reporting references, not extra execution owners.
ORCHESTRATE_RUNS_PATH         = docs/prompts/html_ro/mcp/orchestrate-iterative-runs.html
PRETRAINING_REFERENCE_PATH    = docs/prompts/html_ro/mcp/pretraining-reference.html
UI_ADAPTER_PATH               = docs/prompts/html_ro/mcp/ui-business-frontier-adapter.html
RUN_EXECUTION_PATH            = docs/prompts/html_ro/mcp/execute-and-understand-run.html
REPORTING_PATH                = docs/prompts/html_ro/mcp/reporting.html
BUSINESS_GRAPH_RUBRIC_PATH    = docs/prompts/html_ro/mcp/business-flow-graph-rubric.html
SCORE_OVERVIEW_REFERENCE_PATH = docs/prompts/html_ro/mcp/score-overview-reference.html
ARCHITECTURE_PATH             = docs/Living_Architecture_UI_API_doc_v1_0.html

# Shared report and example-library references
REPORT_STYLE_REFERENCE_PATH   = docs/shared-report-reference.css
HTML_EX_LIBRARY_ROOT          = C:/work/ex/java/MCP/html-ex
HTML_EX_LIBRARY_README        = C:/work/ex/java/MCP/html-ex/README.md

# Shared output roots
AUDIT_OUTPUT_ROOT             = docs/out
AUDIT_OUTPUT_PATH_PATTERN     = AUDIT_OUTPUT_ROOT/YYYY-MM-DD_HH.mm.ss
RUN_ARCHIVE_ROOT              = AUDIT_OUTPUT_PATH_PATTERN/runs
OUT_FEEDBACK_FILE             = AUDIT_OUTPUT_ROOT/README.md

# Generated package bindings. Generated agents own tests plus product-specific support only.
# Framework boundaries are the protected roots below; do not move generated behavior into core.
SEED_RECORDING_CLASS          = src/test/java/com/endava/ai/ui/tests/Example.java
TARGET_UI_TEST_PACKAGE        = com.endava.ai.ui.tests
TARGET_API_TEST_PACKAGE       = com.endava.ai.api.tests
UI_TEST_ROOT                  = src/test/java/com/endava/ai/ui/tests
API_TEST_ROOT                 = src/test/java/com/endava/ai/api/tests
TEST_RESOURCES_ROOT           = src/test/resources

# Main-code support surfaces agents may read and, only when the generated test requires it, extend surgically.
# Keep business-specific helpers in support packages; do not push generated-package behavior into core.
UI_SUPPORT_ROOT               = src/main/java/com/endava/ai/ui/support
API_SUPPORT_ROOT              = src/main/java/com/endava/ai/api/support
UI_SUPPORT_ROOTS              = src/main/java/com/endava/ai/ui/support
API_SUPPORT_ROOTS             = src/main/java/com/endava/ai/api/support

# Protected framework surfaces. Generated-package agents must not modify these.
ATF_CORE_ROOT                 = src/main/java/com/endava/ai/core
MCP_ROOT                      = src/main/java/com/endava/ai/skills/mcp
ATLAS_ROOT                    = src/main/java/com/endava/ai/skills/atlas
UI_CORE_ROOT                  = src/main/java/com/endava/ai/ui/core
API_CORE_ROOT                 = src/main/java/com/endava/ai/api/core
UI_ENGINE_ROOT                = src/main/java/com/endava/ai/ui/engine
