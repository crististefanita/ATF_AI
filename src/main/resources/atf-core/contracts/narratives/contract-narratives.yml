schemaVersion: 1
contracts:
  - id: core.contract-narrative.reporting-inventory-suite
    kind: suite
    profile: CORE_CONTRACT
    area: REPORTING_LIFECYCLE
    capability: ATF contract narrative coverage
    purpose: Validate that ATF-core tests remain visible as an auditable contract inventory.
    reportHint: Add contract metadata and listener wiring to framework capability tests.
  - id: core.contract-narrative.reporting-inventory-method
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: ATF-core Extent test inventory
    expected: All ATF test sources are visible in one audit step, with pure framework contracts separated from live UI/API smoke boundaries.
    observed: The test records totals, capability profile rows, non-contract rows, pure framework rows, and live boundary rows.
    repairHint: "Use precise profiles: Extent/Allure for report adapters, LIVE_API for API smoke, and UI_PRODUCT for real UI product flows."
  - id: core.contract-narrative.diagnostic-html-shell-suite
    kind: suite
    profile: REPORTING_CONTRACT
    area: REPORTING_ADAPTER
    capability: Small diagnostic HTML report shell
    purpose: Keep Atlas, MCP and ATF diagnostic HTML artifacts on one shared visual shell.
    reportHint: Use HtmlText.diagnosticDocument for small generated diagnostic reports; Extent Spark reports keep the native Spark shell.
  - id: core.contract-narrative.diagnostic-html-shell-document
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF diagnostic HTML shell
    expected: Small diagnostic HTML reports share one title, metadata, style wrapper, table palette and status palette.
    observed: The test renders HtmlText.diagnosticDocument and verifies common typography, table, code and status tokens.
    repairHint: Update HtmlText.diagnosticCss instead of copying CSS into Atlas, MCP or ATF report renderers.
  - id: core.contract-narrative.diagnostic-html-shell-families
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF small diagnostic report families
    expected: Atlas, MCP and ATF small generated HTML reports use the same diagnostic shell while Extent keeps native Spark.
    observed: The test renders representative Atlas, MCP CheckRef, MCP KPI and ATF diagnostic documents and compares shell tokens.
    repairHint: Render small table, matrix and board reports through HtmlText.diagnosticDocument; keep Extent Spark normalization in Extent post-processing only.
  - id: core.contract-narrative.diagnostic-html-shell-fragments
    kind: contract
    area: REPORTING_ADAPTER
    owner: MCP and ATF core final report section fragments
    expected: Reusable final-report fragments remain fragments and are embedded into their host report instead of becoming standalone mini documents.
    observed: The test renders MCP CheckRef and ATF core final-audit sections and verifies stable anchors without document shell tokens.
    repairHint: Use HtmlText.diagnosticDocument only for standalone small reports; final report inserts must remain section fragments.
  - id: core.contract-narrative.diagnostic-html-status-palette
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF diagnostic status palette
    expected: Small diagnostic reports use canonical pass, fail, risk and info classes for status cells instead of private status markup.
    observed: The test renders ATF table rows plus MCP KPI matrix and repair-board rows, then inspects Atlas status rendering source.
    repairHint: Route status cells through HtmlTable.Cell.classed with pass, fail, risk and info and keep shared CSS in HtmlText.diagnosticCss.
  - id: core.contract-narrative.diagnostic-html-shell-renderers
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF diagnostic HTML shell
    expected: Main report renderers do not hand-roll full HTML documents or private diagnostic CSS shells.
    observed: The test scans src/main/java and allows full document assembly only in HtmlText.
    repairHint: Replace raw doctype wrappers and direct HtmlText.document calls with HtmlText.diagnosticDocument.
  - id: core.contract-narrative.diagnostic-html-table-model
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF small diagnostic table model
    expected: Standalone Atlas, MCP and ATF diagnostic HTML reports use HtmlTable and HtmlTableColumn instead of hand-written table markup.
    observed: The test scans known standalone diagnostic renderers and blocks private table assembly outside HtmlTable.
    repairHint: Move table headings, cells and status rendering into HtmlTable and HtmlTableColumn so the visual shell stays uniform.
  - id: core.contract-narrative.diagnostic-html-yaml-standards
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF reporting shell YAML policy
    expected: reporting-shell.yml declares the diagnostic document shell, table model, status palette and no-Extent-shell boundary.
    observed: The test resolves required reporting-shell YAML rows by id so the standard is visible outside Java source.
    repairHint: Keep reporting-shell.yml synchronized whenever adding a new small diagnostic report family.
  - id: core.contract-narrative.core-reporting-matrix-suite
    kind: suite
    profile: REPORTING_CONTRACT
    area: REPORTING_ADAPTER
    capability: Core reporting matrix
    purpose: Validate small, varied reporting combinations without turning sanity runs into full sweeps.
    reportHint: Use this profile when Extent Overview, aggregate, Atlas, or MCP reporting shell contracts move.
  - id: core.contract-narrative.core-reporting-matrix
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF core reporting
    expected: Small TestNG profiles cover pass/fail/skip, aggregate, Atlas, and MCP sanity surfaces.
    observed: The contract inspects generated Extent HTML plus TestNG XML composition.
    repairHint: Keep the matrix small; add focused fixtures or profile rows instead of widening full sweeps.
  - id: core.contract-narrative.extent-canonical-shell-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Extent canonical shell across ATF report families
    purpose: Prevent MCP, Atlas, ATF-core, mixed component and runtime-audited reports from drifting away from the shared Extent shell.
    reportHint: Run this contract whenever Extent Overview, status filtering, runtime audit, synthetic fixtures or report publication changes.
  - id: core.contract-narrative.extent-canonical-shell-contract
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentSparkHtmlPostProcessor + ExtentAdapter
    expected: Every Extent report family keeps the same navigable shell with Overview, ATF score cards, tag tables, status menu, Fail filtering and report-mode markers.
    observed: The test generates MCP-like, Atlas-like, ATF-core-like, mixed component and runtime-audited reports and validates shared shell invariants.
    repairHint: Do not special-case MCP, Atlas or core reports into raw Spark HTML; route all Extent output through the shared finalizer and shell patch planners.
  - id: core.contract-narrative.extent-report-mode-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Extent report mode normalization
    purpose: Classify Extent reports as runtime-audited or component/adapter without requiring browser execution.
    reportHint: Run this fast post-processor contract before visual Extent browser suites.
  - id: core.contract-narrative.extent-report-mode-contract
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentSparkHtmlPostProcessor
    expected: Every normalized Extent report publishes a machine-readable mode marker; non-runtime reports still receive a clean ATF component Overview.
    observed: The test feeds runtime and component Spark HTML snippets through the post-processor.
    repairHint: Keep report-mode detection idempotent and keep component/adapter Overview cleanup separate from runtime audit rendering.
  - id: core.contract-narrative.extent-html-patch-pipeline-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Extent HTML patch pipeline
    purpose: Keep Extent HTML normalization expressed as typed patch results instead of hidden string mutation.
    reportHint: Repair ExtentHtmlPatchResult/planners before adding new Extent report-mode or Overview branches.
  - id: core.contract-narrative.extent-html-patch-pipeline-contract
    kind: contract
    area: REPORTING_ADAPTER
    owner: Extent HTML patch pipeline
    expected: Extent normalization reports which patches applied and keeps report-mode and Overview tokens behind semantic owners.
    observed: The tests inspect patch records and verify normalized output through semantic constants.
    repairHint: Route new report changes through planners and semantic token owners, not private postprocessor literals.
  - id: core.contract-narrative.extent-status-dropdown-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Extent Spark status dropdown contract
    purpose: Protect status filtering as test-case navigation, not nested-step filtering.
    reportHint: Run this suite only in the Extent profile; it validates browser-visible status filter behavior.
  - id: core.contract-narrative.extent-status-dropdown-contract
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentSparkCollapsePolicy + runtime audit status menu
    expected: Status filters isolate pass/fail/skipped test cases and clear back to the full hierarchy.
    observed: The suite opens generated Extent HTML in Chromium and exercises the status dropdown.
    repairHint: Repair status menu normalization or test-case filtering before changing Extent navigation.
  - id: core.contract-narrative.extent-failure-triage-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Extent Spark failure triage contract
    purpose: Protect the failed-runtime Category tab as a readable failure grouping and repair surface.
    reportHint: Run this suite only in the Extent profile; it validates failure grouping, root cause detail, and green empty state.
  - id: core.contract-narrative.extent-failure-triage-contract
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentRuntimeDashboardRenderer + runtime failure grouping
    expected: Failed test cases are grouped by class/root cause and green runs show an explicit empty state.
    observed: The suite generates Extent reports, inspects the Category view, and reconciles failure counts with the runtime ledger.
    repairHint: Repair runtime failure grouping before changing dashboard or category rendering.
  - id: core.contract-narrative.annotation-hygiene-suite
    kind: suite
    profile: CORE_CONTRACT
    area: CORE_ARCHITECTURE
    capability: Contract annotation hygiene
    purpose: Keep public contract annotations runtime-visible, documented, targeted, YAML-addressable, and explicitly cataloged.
    reportHint: Add new contract annotations to the best-practice catalog and prefer YAML refs for bulky narrative metadata.
  - id: core.contract-narrative.annotation-hygiene-catalog
    kind: contract
    area: CORE_ARCHITECTURE
    owner: ATF contract annotation catalog
    expected: Every public contract annotation has runtime retention, explicit targets, documentation, no deprecated marker drift, and a YAML-ref adoption guardrail.
    observed: The test scans main/test annotation sources, validates the curated annotation catalog, resolves YAML refs, and checks ATF ref adoption does not regress.
    repairHint: Either remove obsolete annotations or add new first-class annotations to CONTRACT_ANNOTATIONS with precise targets and YAML narrative rows.
  - id: core.contract-narrative.yaml-manifest-suite
    kind: suite
    profile: CORE_CONTRACT
    area: CORE_ARCHITECTURE
    capability: ATF core YAML contract manifest
    purpose: Keep declarative ATF core YAML contracts indexed, schema-valid, and mapped to real source/test surfaces.
    reportHint: Add manifest coverage whenever a new ATF core YAML catalog is introduced.
  - id: core.contract-narrative.yaml-manifest-catalog
    kind: contract
    area: CORE_ARCHITECTURE
    owner: ATF core YAML contract catalog
    expected: Every ATF core YAML catalog has valid schema, unique ids, typed lookups, and source-backed contract evidence.
    observed: The test validates profiles, boundaries, size budgets, reporting ownership, UI engine contracts, policies, annotations, and narratives.
    repairHint: Update the YAML spec class, catalog index, and manifest test together for every new YAML-backed contract family.
  - id: core.contract-narrative.yaml-narrative-suite
    kind: suite
    profile: CORE_CONTRACT
    area: REPORTING_LIFECYCLE
    capability: ATF YAML contract narratives
    purpose: Validate YAML-backed ATF contract narrative rows and @AtfContractRef report resolution.
    reportHint: Put bulky contract narrative text in YAML and keep Java annotations as thin ids where possible.
  - id: core.contract-narrative.yaml-narrative-catalog
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: ATF YAML contract narrative catalog
    expected: Contract narrative YAML rows have valid profile/area references and can feed Extent report narration through ref annotations.
    observed: The test validates contract/suite narrative rows and exercises AtfContractReportNarrator with YAML-backed refs.
    repairHint: Update contract-narratives.yml and the ref annotation tests together when moving contract text out of Java annotations.
  - id: core.contract-narrative.coverage-audit-suite
    kind: suite
    profile: CORE_CONTRACT
    area: REPORTING_LIFECYCLE
    capability: ATF contract narrative coverage
    purpose: Validate that ATF-core tests remain visible as an auditable contract inventory.
    reportHint: Add contract metadata and listener wiring to framework capability tests.
  - id: core.contract-narrative.coverage-audit-class
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: ATF-core contract report readability
    expected: Important ATF-core contract suites publish Expected framework contract and Cold framework verdict details through TestListener or an explicit self-auditing Extent contract.
    observed: The test scans ATF-core test sources for ATF contract annotations, TestListener wiring, and self-auditing Extent exceptions.
    repairHint: When adding an ATF-core capability test, annotate it with @AtfContractRef or @AtfContract and wire TestListener. Use a self-auditing Extent contract only for report-rendering tests that must disable framework reporting.
  - id: core.contract-narrative.coverage-audit-method
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: ATF-core Extent readability contract
    expected: Every ATF contract test class in com.endava.ai.atf is either listener-backed or explicitly self-auditing for Extent rendering.
    observed: The test walks source files under src/test/java/com/endava/ai/atf and checks report auditability for every executable contract suite.
    repairHint: Add @Listeners(TestListener.class), or use @NoFrameworkReporting with extent-only only for self-auditing Extent browser/report tests.
  - id: core.contract-narrative.base-api-runtime-suite
    kind: suite
    profile: API_BASE_CONTRACT
    area: API_LIFECYCLE
    capability: Base API runtime contract
    purpose: Validate API base-class readiness, token gating, and listener wiring.
    reportHint: Repair BaseTestAPI setup, token handling, or API listener wiring.
  - id: core.contract-narrative.base-api-runtime-class
    kind: contract
    area: API_LIFECYCLE
    owner: BaseTestAPI
    expected: BaseTestAPI initializes API runtime once and blocks write-oriented API flows when auth.token is absent.
    observed: The contract inspects listener and lifecycle annotations and exercises token readiness behavior through a test subclass.
    repairHint: Keep API setup deterministic and keep auth-token absence as a skip, not as a hidden failed write.
  - id: core.contract-narrative.base-api-listener-setup
    kind: contract
    area: API_LIFECYCLE
    owner: BaseTestAPI listener and setup contract
    expected: BaseTestAPI wires Allure/TestListener and keeps API runtime setup in @BeforeClass(alwaysRun=true).
    observed: The test reads @Listeners and verifies baseSetup() lifecycle metadata.
    repairHint: Restore BaseTestAPI listener wiring and class-level baseSetup lifecycle if API reporting or initialization drifts.
  - id: core.contract-narrative.base-api-auth-readiness
    kind: contract
    area: API_LIFECYCLE
    owner: BaseTestAPI auth readiness contract
    expected: Missing auth.token produces a deliberate SkipException for write-oriented API tests; present token allows execution to continue.
    observed: The test calls requireTokenForWrites() through a subclass with blank and non-blank tokens.
    repairHint: Keep auth readiness explicit so API contract tests do not perform unauthenticated writes by accident.
  - id: core.contract-narrative.base-api-no-ui-runtime
    kind: contract
    area: API_LIFECYCLE
    owner: API core source boundary
    expected: API core and ATF API lifecycle tests must not initialize or reference UI engine runtime.
    observed: The test scans API main/test sources for UI runtime markers such as UIEngine, DriverManager, BaseTestUI, ui.engine, and ui.headless.
    repairHint: Move UI runtime concerns to UI support tests; API lifecycle contracts must stay HTTP/API-only.
  - id: core.contract-narrative.base-api-package-architecture
    kind: contract
    area: API_LIFECYCLE
    owner: API package architecture
    expected: Main API code is split into api.core for generic API framework pieces and api.support for current domain/test-facing flows.
    observed: The test verifies core client/validation/utils roots, support roots, and rejects legacy or generic packages under api.support.
    repairHint: Keep BaseTestAPI, HTTP client, generic validators, waits, JSON and stacktrace helpers under api.core; keep domain steps/services/models/factories under api.support.
  - id: core.contract-narrative.base-api-console-hygiene
    kind: contract
    area: API_LIFECYCLE
    owner: API core console hygiene
    expected: API core routes diagnostic output through reporting helpers instead of writing directly to System.out.
    observed: The test scans api.core sources for direct System.out usage.
    repairHint: Use StepLogger or ConsoleLogger from framework reporting utilities instead of System.out in API core.
  - id: core.contract-narrative.base-api-wait-centralization
    kind: contract
    area: API_LIFECYCLE
    owner: API core wait hygiene
    expected: API core centralizes Thread.sleep and interrupt handling in ApiSleeper.
    observed: The test scans api.core sources for direct Thread.sleep usage outside ApiSleeper.
    repairHint: Route API waits through ApiSleeper so interrupt handling stays explicit and consistent.
  - id: core.contract-narrative.base-api-wait-interrupt-policy
    kind: contract
    area: API_LIFECYCLE
    owner: API core wait interrupt policy
    expected: ApiSleeper rejects invalid durations and preserves interrupted status when a wait is interrupted.
    observed: The test exercises the centralized API wait helper directly.
    repairHint: Keep ApiSleeper as the single place for API wait validation and interrupt propagation.
  - id: core.contract-narrative.base-api-validation-model-boundary
    kind: contract
    area: API_LIFECYCLE
    owner: API core validation model boundary
    expected: Generic API validation DTOs must live physically and logically under api.core.validation.model, not api.support.model.
    observed: The test checks source package declarations, runtime class package names, and ResponseValidator imports.
    repairHint: Keep generic error/validation response DTOs under api.core.validation.model; keep product/domain DTOs under api.support.model.
  - id: core.contract-narrative.reporting-package-shape-suite
    kind: suite
    profile: REPORTING_CONTRACT
    area: REPORTING_ADAPTER
    capability: ATF reporting package shape contract
    purpose: Keep new reporting packages small and keep legacy Extent/reporting debt under explicit ratchet caps.
    reportHint: Split reporting packages by adapter or presentation responsibility before adding more contract classes.
  - id: core.contract-narrative.reporting-package-shape-class
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF reporting package architecture
    expected: New reporting packages contain at most ten direct Java classes; catalogued legacy packages cannot grow.
    observed: The test scans main reporting code and ATF reporting contract tests by direct package with legacy caps.
    repairHint: Create a focused subpackage when a reporting family reaches the readability threshold; shrink catalogued caps after each split.
  - id: core.contract-narrative.reporting-package-shape-class-size
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF core reporting class-size guardrails
    expected: Reporting classes stay within role-based readability thresholds.
    observed: The test scans listener, adapter, composer and Extent Spark section class sizes.
    repairHint: Split oversized classes into model, renderer, section or token collaborators before adding behavior.
  - id: core.contract-narrative.reporting-package-shape-extent-package-map
    kind: contract
    area: REPORTING_ADAPTER
    owner: Extent Spark package ownership map
    expected: Extent Spark shell code is split into composer, tokens and section packages with explicit size caps.
    observed: The test verifies Spark root/tokens/section packages and prevents any one Spark ownership lane from becoming a dumping ground.
    repairHint: Move new visual behavior into the matching Spark section package or create a new focused section before raising caps.
  - id: core.contract-narrative.reporting-package-shape-aggregate-ownership
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF core aggregate runtime ownership
    expected: Reusable aggregate report writers, artifact utilities, runtime audit mappers and value objects live in main, while TestNG contract fixtures stay in test.
    observed: The test verifies the new aggregate main package and blocks the old test-side writer/artifact locations.
    repairHint: Move reusable aggregate reporting code under com.endava.ai.core.reporting.aggregate; leave only listener wiring, fixtures and contract tests under com.endava.ai.atf.core.reporting.
  - id: core.contract-narrative.reporting-package-shape-test-size
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF contract-test size guardrails
    expected: New ATF contract tests stay below the giant-test threshold and legacy large tests cannot grow.
    observed: The test scans ATF test sources for classes above the size threshold and compares known debt to caps.
    repairHint: Split large contract tests by capability before adding more assertions.
  - id: core.contract-narrative.reporting-package-shape-legacy-test-ratchets
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF reporting legacy test ratchets
    expected: Legacy test caps stay close to current file size so old debt cannot silently grow back.
    observed: The test compares every legacy-test-cap YAML row with the current Java line count.
    repairHint: After splitting a reporting fixture or contract test, lower the YAML cap in size-budgets.yml.
  - id: core.contract-narrative.reporting-package-shape-no-ui-dependency
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF core package boundary
    expected: ATF core remains a generic reporting/runtime layer and does not import UI implementation packages.
    observed: The test scans main core source files for direct com.endava.ai.ui dependencies.
    repairHint: Expose a core extension point and register UI contributors from ui.core instead of importing UI classes in core.
  - id: core.contract-narrative.reporting-package-shape-typed-end-status
    kind: contract
    area: REPORTING_ADAPTER
    owner: Typed ReportLogger contract
    expected: ReportLogger.endTest(TestStatus) is the only end-test API; legacy String status closes are removed.
    observed: The test scans core reporting source and reporting fixtures for legacy String status APIs.
    repairHint: Implement endTest(TestStatus) everywhere and do not reintroduce String status bridge methods.
  - id: core.contract-narrative.reporting-package-shape-manager-session
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: ReportingManager session boundary
    expected: ReportingManager stays a static facade and mutable logger state lives in ReportingSession.
    observed: The test inspects ReportingManager source for direct static ReportLogger state.
    repairHint: Keep logger/testLogger fields inside ReportingSession and expose only facade methods from ReportingManager.
  - id: core.contract-narrative.reporting-package-shape-collapse-composer
    kind: contract
    area: REPORTING_ADAPTER
    owner: Extent Spark collapse composer
    expected: ExtentSparkCollapsePolicy remains a small public composer over sections/collapse.
    observed: The test checks class size and verifies that JS behavior lives in the collapse section package.
    repairHint: Add new collapse behavior to focused section classes, not to ExtentSparkCollapsePolicy.
  - id: core.contract-narrative.reporting-package-shape-no-ignored-catches
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: Core non-blocking diagnostics
    expected: Core code does not hide non-blocking failures behind catch variables named ignored.
    observed: The test scans core source for catch clauses that bind ignored failures.
    repairHint: Route non-blocking failures through NonBlockingDiagnostic.warn(...) instead of swallowing them.
  - id: core.contract-narrative.reporting-package-shape-diagnostic-sink
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: Core non-blocking diagnostics
    expected: Non-blocking warnings are routed through a diagnostic sink instead of being hardwired to stderr.
    observed: The test inspects NonBlockingDiagnostic source for sink-based publication.
    repairHint: Keep NonBlockingDiagnostic.warn(...) as buffer + sink publication so tests can assert warnings.
  - id: core.contract-narrative.extent-adapter-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Reporting adapter contract
    purpose: Validate Extent/Allure adapter behavior and artifact hygiene.
    reportHint: Repair adapter output, cleanup, or attachment serialization.
  - id: core.contract-narrative.extent-adapter-class
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentAdapter
    expected: Extent writes one reopenable HTML report, escapes HTML-like step text, and does not require local spark assets.
    observed: Adapter self-tests generate isolated Extent fixture output and inspect the produced HTML.
    repairHint: Check ExtentAdapter escaping and ExtentReporter single-file configuration.
  - id: core.contract-narrative.extent-adapter-component-overview
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentAdapter + ExtentSparkHtmlPostProcessor
    expected: Every ExtentAdapter flush writes a standardized Spark report with report-mode marker, ATF component tag tables, and no raw Spark Overview cards.
    observed: The test generates a small component/adapter Extent report through ExtentAdapter.flush and inspects the persisted HTML.
    repairHint: Keep ExtentReportSession.flushAndStandardize wired to ExtentSparkHtmlPostProcessor; do not let raw Spark Overview HTML escape to target/reports.
  - id: core.contract-narrative.extent-adapter-default-report-dir
    kind: contract
    area: REPORTING_ADAPTER
    owner: framework.properties
    expected: The default Extent HTML artifact is generated under target/reports, not under the Allure artifact folder.
    observed: The test reads src/main/resources/framework.properties and checks the canonical reports.dir value.
    repairHint: Keep reports.dir=target/reports for Extent. Allure results belong under the dedicated Allure result directory.
  - id: core.contract-narrative.extent-adapter-fixture-sandbox
    kind: contract
    area: REPORTING_ADAPTER
    owner: Extent adapter contract fixtures
    expected: Adapter self-tests use an isolated contract report directory and do not create extra final-run reports.
    observed: The test checks the active fixture reports.dir sandbox used by ExtentAdapterTest.
    repairHint: Keep adapter fixture reports in a temporary sandbox, not target/reports or target/contract-reports.
  - id: core.contract-narrative.extent-adapter-stable-artifact
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportSettings
    expected: When timestamped reports are disabled, Extent resolves a stable ExtentReport.html artifact in the configured reports directory.
    observed: The test builds ExtentReportSettings from explicit values and inspects the resolved report path.
    repairHint: Keep timestamp naming inside ExtentReportSettings so report paths stay auditable and testable.
  - id: core.contract-narrative.extent-adapter-timestamped-artifact
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportSettings
    expected: When timestamped reports are enabled, Extent resolves an ExtentReport_<timestamp>.html artifact using the configured format.
    observed: The test builds ExtentReportSettings with a deterministic timestamp and checks the generated file name.
    repairHint: Do not duplicate timestamp file-name logic in ExtentReporter or tests; keep it in ExtentReportSettings.
  - id: core.contract-narrative.extent-adapter-explicit-file-name
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportSettings
    expected: Maven can declare an explicit Extent HTML file name for published validation artifacts without post-processing the generated report.
    observed: The test configures reports.file.name and verifies Extent resolves that exact file inside reports.dir.
    repairHint: Keep published Extent artifact names configurable through ExtentReportSettings, not through copy/rename scripts.
  - id: core.contract-narrative.extent-adapter-file-names-helper
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportFiles
    expected: Stable and timestamped Extent report names are identified by one reusable contract object.
    observed: The test verifies the shared filename factory and matcher used by runtime locators and tests.
    repairHint: Do not duplicate ExtentReport.html / ExtentReport_<timestamp>.html checks in listener or test code.
  - id: core.contract-narrative.extent-adapter-runtime-settings
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportSettings
    expected: ExtentReporter consumes one runtime settings object instead of recomputing report path, title, and report name inline.
