schemaVersion: 1
contracts:
  - id: 'api-generated.structure.legacy-path.negative'
    expected: 'Generated API sources must stay under api.support.* and api.tests.<business-area>.*.'
    artifacts: 'review/root-source-thin-no-index.diff'
    failureMeaning: 'An agent can add business API flow code into old direct api/model/service/test locations.'
    repairHint: 'Move generated API support under api.support.* and API tests under api.tests.<business-area>.'
  - id: 'artifact.freshness.coherent'
    expected: 'Render/link/state/score artifacts are fresh enough to support the final report.'
    artifacts: 'analysis/langgraph-business-understanding.html,review/package-state.json'
    failureMeaning: 'A later edit may have made the frozen proof stale.'
    repairHint: 'Rerun render/link/MCP gates after report or state edits.'
  - id: 'business-evidence.object.trace.negative'
    expected: 'Business object claims must be backed outside package-state by report, run-state, diff, and proof evidence.'
    artifacts: 'review/package-state.json,analysis/langgraph-business-understanding.html,runs/run_##/review/run-state.json,runs/run_##/review/thin-no-index.diff'
    failureMeaning: 'A package can repeat a business object in state without proving it through executable evidence.'
    repairHint: 'Carry the owned business object through report proof mapping, run states, focused diffs, and execution proof.'
  - id: 'business.next-object.required.negative'
    expected: 'Every package must name a concrete primary next business object when it claims future closure pressure.'
    artifacts: 'review/package-state.json,review/package-close-out.md'
    failureMeaning: 'The package leaves continuation pressure generic, so the next agent cannot calibrate the next business closure.'
    repairHint: 'Publish a singular next business object in package-state and close-out, then regenerate the MCP package artifacts.'
  - id: 'claim-to-evidence.chain'
    expected: 'Major report claims link to diff, execution proof, machine result, state and verdict.'
    artifacts: 'analysis/langgraph-business-understanding.html,runs/run_##'
    failureMeaning: 'The final report is plausible prose without a cold evidence chain.'
    repairHint: 'Attach each major claim to source diff, Extent/XML, run-state and package-state.'
  - id: 'claimed-absence.requires-ui-assertion'
    expected: 'Any claimed business absence is backed by an explicit UI assertion/proof.'
    artifacts: 'analysis/langgraph-business-understanding.html,src/test/java'
    failureMeaning: 'The package sells a negative business claim without observable proof.'
    repairHint: 'Add or link the explicit assertion that proves the absence.'
  - id: 'decision.trace.auditable'
    expected: 'Stop/continue/fresh-root decisions are backed by state and close-out evidence.'
    artifacts: 'review/package-state.json,review/package-close-out.md'
    failureMeaning: 'The package decision is prose-only and cannot be audited.'
    repairHint: 'Add the decision basis to package-state, gate card or close-out.'
  - id: 'final-report.no-unverifiable-language'
    expected: 'The final report avoids strong unverifiable claims without linked evidence.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The report overstates ownership or readiness beyond proof.'
    repairHint: 'Cap the language or add evidence for every strong ownership claim.'
  - id: 'learning.trace.quality'
    expected: 'Learning trace connects claim, decision, evidence, lesson and next implication.'
    artifacts: 'runs/run_##/SUMMARY.md,runs/run_##/review/run-state.json'
    failureMeaning: 'Runs are mechanically green but do not teach the next agent what changed.'
    repairHint: 'Rewrite run learning around distinct decisions and evidence-backed lessons.'
  - id: 'pretraining.intake.quality'
    expected: 'Pretraining states sources read, extracted frontier, anti-inheritance and saved artifact.'
    artifacts: 'review/round-pretraining-brief.md'
    failureMeaning: 'The run may be operating from memory or copied examples instead of cold intake.'
    repairHint: 'Publish a focused pretraining intake before claiming a governed package.'
  - id: 'root-diff.source-files.exist'
    expected: 'Every source file referenced by the root diff exists in the current project.'
    artifacts: 'review/root-source-thin-no-index.diff,src/test/java'
    failureMeaning: 'The package claims code that cannot be reopened.'
    repairHint: 'Restore the referenced source or regenerate the root diff from current source.'
  - id: 'runtime.prompt-documents.exist'
    expected: 'Every runtime prompt/document path resolves locally.'
    artifacts: 'docs/prompts/html_ro/mcp/agent-runtime.properties'
    failureMeaning: 'The package depends on a prompt contract that the next agent cannot reopen.'
    repairHint: 'Fix the runtime path or restore the referenced prompt document.'
  - id: 'runtime.targets.no-drift.negative'
    expected: 'Generated package runtime values must stay synchronized with agent-runtime.properties.'
    artifacts: 'review/package-state.json,analysis/langgraph-business-understanding.html,agent-runtime.properties'
    failureMeaning: 'The package can silently use stale thresholds, run counts, or target test counts.'
    repairHint: 'Read runtime values from agent-runtime.properties and regenerate package-state/report runtime disclosures.'
  - id: 'runtime.values.published'
    expected: 'Runtime values used by the package are published from agent-runtime.properties.'
    artifacts: 'docs/prompts/html_ro/mcp/agent-runtime.properties,review/package-state.json'
    failureMeaning: 'The package cannot be reopened against the same runtime contract.'
    repairHint: 'Republish runtime values from agent-runtime.properties and rerun MCP.'
  - id: 'source.evolution.kpi.numeric-values.negative'
    expected: 'Source evolution ledger publishes numeric KPI values reconciled with root and run diffs.'
    artifacts: 'review/source-evolution-ledger.md'
    failureMeaning: 'A ledger can name the right KPIs while avoiding measurable source-evolution accountability.'
    repairHint: 'Publish root_diff_files_count, src_main_files, src_test_files, added/modified/deleted, protected count and per-run file counts.'
  - id: 'source.evolution.kpi.protected-root-drift.negative'
    expected: 'protected_root_dirty_count cannot be zero when root diff references protected framework/MCP paths.'
    artifacts: 'review/source-evolution-ledger.md,review/root-source-thin-no-index.diff'
    failureMeaning: 'A package can claim protected-root purity while hiding framework drift in the diff.'
    repairHint: 'Undo protected changes or report protected_root_dirty_count accurately and accept the publishability cap/blocker.'
  - id: 'source.evolution.kpi.value-mismatch.negative'
    expected: 'Source evolution ledger counters match the files visible in root-source-thin-no-index.diff.'
    artifacts: 'review/source-evolution-ledger.md,review/root-source-thin-no-index.diff'
    failureMeaning: 'A package can inflate or deflate progress KPIs without changing the actual diff evidence.'
    repairHint: 'Recalculate KPI counters from root and run diffs immediately before close-out.'
  - id: 'source.evolution.ledger.auditable'
    expected: 'Package publishes a source evolution ledger from baseline_before_run_0 through final close-out.'
    artifacts: 'review/source-evolution-ledger.md,review/root-source-thin-no-index.diff,runs/run_##/review/thin-no-index.diff'
    failureMeaning: 'The package can have valid diffs but no compact KPI view of real progress.'
    repairHint: 'Add review/source-evolution-ledger.md with baseline, run deltas, final state, score_delta and canonical progress KPIs.'
  - id: 'source.evolution.ledger.kpi.negative'
    expected: 'Source evolution ledger carries canonical progress KPI sections and run links.'
    artifacts: 'review/source-evolution-ledger.md'
    failureMeaning: 'A ledger can exist as prose but fail to calibrate agentic progress.'
    repairHint: 'Add the canonical KPIs plus run_##_delta links to run diff/state and source paths.'
  - id: 'source.evolution.ledger.missing.negative'
    expected: 'Generated packages publish review/source-evolution-ledger.md.'
    artifacts: 'review/source-evolution-ledger.md'
    failureMeaning: 'A package can claim progress without a compact baseline-to-final source evolution ledger.'
    repairHint: 'Create source-evolution-ledger.md with baseline_before_run_0, run deltas, final_before_closeout and score_delta KPIs.'
  - id: 'source.evolution.report-kpi-summary.negative'
    expected: 'Final report links source-evolution-ledger.md and summarizes matching source KPI counters.'
    artifacts: 'analysis/langgraph-business-understanding.html,review/source-evolution-ledger.md'
    failureMeaning: 'A final report can link a ledger but keep the progress KPI truth hidden from the public close-out page.'
    repairHint: 'Add a compact source evolution KPI summary to the final report with values matching the ledger and root diff.'
  - id: 'source.framework-protection'
    expected: 'Generated package diffs do not mutate protected framework, core, MCP or service layers.'
    artifacts: 'review/root-source-thin-no-index.diff'
    failureMeaning: 'The generated package is changing the validator/framework instead of only publishing package evidence.'
    repairHint: 'Move protected-layer edits out of the generated package and rerun MCP source checks.'
  - id: 'source.protected-core-surfaces.not-mutated.negative'
    expected: 'Generated package diffs must not mutate reusable ATF core, UI core, API core, ATF contract tests, MCP tests, or MCP suites.'
    artifacts: 'review/root-source-thin-no-index.diff,runs/run_##/review/thin-no-index.diff'
    failureMeaning: 'An agent can change reusable framework contracts instead of proving product-facing behavior through allowed layers.'
    repairHint: 'Keep reusable framework surfaces untouched; place generated business work in support/test layers and request an explicit framework-change task separately.'
  - id: 'source.protected-framework.not-mutated.negative'
    expected: 'Generated package diffs must not mutate MCP, core framework, service, engine, reporting, or prompt infrastructure.'
    artifacts: 'review/root-source-thin-no-index.diff'
    failureMeaning: 'An agent can improve its own validator/framework instead of proving product-facing business behavior.'
    repairHint: 'Move generated changes into allowed test/business-facing layers and keep framework/MCP/core source untouched.'
  - id: 'source.protected-git-status.not-mutated.negative'
    expected: 'When -Dmcp.project.root is available, protected live git changes are rejected even if the frozen root diff omits them.'
    artifacts: 'git status --porcelain,review/root-source-thin-no-index.diff'
    failureMeaning: 'An agent can leave MCP/ATF core changes in the audited worktree while publishing a clean-looking package diff.'
    repairHint: 'Undo protected workspace changes or move them to an explicit ATF_name/MCP framework task before package close-out.'
  - id: 'source.protected-rename.not-mutated.negative'
    expected: 'Protected source moves/renames are rejected, not only direct file edits.'
    artifacts: 'review/root-source-thin-no-index.diff'
    failureMeaning: 'An agent can bypass protected path checks by moving framework files through rename metadata.'
    repairHint: 'Do not rename or move protected framework surfaces in generated package diffs.'
  - id: 'source.protected-run-diff.not-mutated.negative'
    expected: 'Per-run diffs must obey the same protected source policy as root diffs.'
    artifacts: 'runs/run_##/review/thin-no-index.diff'
    failureMeaning: 'A run can hide framework mutation outside the root diff.'
    repairHint: 'Keep every per-run diff scoped to generated business/test evidence, never reusable core or MCP contract code.'
  - id: 'ui-generated.structure.legacy-path.negative'
    expected: 'Generated UI sources must not use old direct ui/actions, ui/pages, ui/model, ui/validation or flat ui/tests paths.'
    artifacts: 'review/root-source-thin-no-index.diff'
    failureMeaning: 'An agent can resurrect the old UI layout instead of using ui.support.* and ui.tests.<business-area>.*.'
    repairHint: 'Move generated UI support code under ui.support.* and tests under ui.tests.<business-area>.'
  - id: 'ui-wrapper.handoff.quality'
    expected: 'UI wrapper handoff names actor, intent, visible object, local verdict and blocker/lesson.'
    artifacts: 'review/ui-wrapper-handoff.md,runs/run_##/review/run-state.json'
    failureMeaning: 'Execution may be selector/helper work sold as business frontier.'
    repairHint: 'Rebuild handoff from actor -> intent -> visible object -> result -> lesson.'
  - id: 'ui.test-architecture.framework-reporting-enabled.comment-safe'
    expected: 'The reporting visibility rule detects only real @NoFrameworkReporting annotations, not comments, imports, or string literals.'
    artifacts: 'review/root-source-thin-no-index.diff,src/test/java/com/ai/ui/tests'
    failureMeaning: 'The MCP contract would become noisy and fail generated packages because of documentation text.'
    repairHint: 'Keep Java source scanning annotation-aware; strip comments before matching the annotation line.'
  - id: 'ui.test-architecture.framework-reporting-enabled.negative'
    expected: 'MCP-generated UI tests must not use @NoFrameworkReporting; BaseTestUI owns the reporting lifecycle.'
    artifacts: 'review/root-source-thin-no-index.diff,src/test/java/com/ai/ui/tests'
    failureMeaning: 'A generated UI test can pass locally while disappearing from the final Extent/Allure evidence chain.'
    repairHint: 'Remove @NoFrameworkReporting and keep the test under BaseTestUI/TestListener reporting.'

