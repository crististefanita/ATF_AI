schemaVersion: 1
contracts:
  - id: 'business-graph.rendered-application-map'
    expected: 'Business Flow Graph renders as a readable application-first diagram, not a procedural test inventory.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The report does not make the business flow understandable before audit tables.'
    repairHint: 'Regenerate the graph from application business objects; keep run slots in Proof Mapping, Run Audit and Artifact Index, not as graph nodes.'
  - id: 'business-graph.canvas-density'
    expected: 'Business Flow Graph uses a balanced SVG canvas with meaningful business-node density and no large empty panel.'
    artifacts: 'analysis/langgraph-business-understanding.html,analysis/shared-report-reference.css'
    failureMeaning: 'The package can be technically mapped but visually weak: tiny node chains float inside oversized graph panels.'
    repairHint: 'Tighten the SVG viewBox, reduce graph-panel whitespace, or add a real second lane for frontier/proof context.'
  - id: 'business-graph.visible-owned-frontier-semantics'
    expected: 'Business Flow Graph visibly distinguishes owned business nodes from capped/not-owned frontier nodes using CSS-backed classes.'
    artifacts: 'analysis/langgraph-business-understanding.html,analysis/shared-report-reference.css'
    failureMeaning: 'The graph can claim cap/frontier semantics in text while rendering every node as the same neutral box.'
    repairHint: 'Use class="node owned" for owned objects and class="node cap" or class="node blocked" for frontier objects; do not invent unsupported classes such as capped.'
  - id: 'business-graph.frontier-edge-cue'
    expected: 'Business Flow Graph renders next/frontier pressure with a CSS-backed edge cue, not inline stroke color.'
    artifacts: 'analysis/langgraph-business-understanding.html,analysis/shared-report-reference.css'
    failureMeaning: 'The graph can have a true frontier node while still looking like an undifferentiated straight-line diagram.'
    repairHint: 'Route frontier edges with edge dashed, edge soft, edge frontier or edge cap; keep the visual meaning in shared CSS classes.'
  - id: 'business-graph.calm-typography'
    expected: 'Business Flow Graph uses calm html-ex typography: centered node titles/subtitles without blanket bold SVG text.'
    artifacts: 'analysis/langgraph-business-understanding.html,analysis/shared-report-reference.css'
    failureMeaning: 'The graph may be technically present but visually louder or less readable than calibrated html-ex reports.'
    repairHint: 'Use .nt and .ns labels with centered text-anchor; keep emphasis on semantic classes and not global bold text.'
  - id: 'business-graph.collapsible-legend'
    expected: 'Business Flow Graph publishes its legend as a nested collapsed details block.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The report can crowd the business graph with explanatory prose instead of keeping a clean visual first read.'
    repairHint: 'Render <details class="graph-legend subdetails"><summary>Legend</summary> below the SVG and keep it collapsed by default.'
  - id: 'business-graph.no-inline-svg-legend-band'
    expected: 'Business Flow Graph does not draw legend bands inside the SVG canvas.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The SVG becomes a mixed graph/prose panel and usually creates cramped, duplicated legend zones.'
    repairHint: 'Remove <g class="graph-legend"> or legend rect/text bands from SVG; move explanatory content into the nested Legend details.'
  - id: 'business-graph.legend-content'
    expected: 'Business Flow Graph legend explains application map, owned/countable nodes, capped frontier, next closure and proof boundary.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The graph may look acceptable while leaving reviewers unsure how ownership, frontier and proof evidence should be read.'
    repairHint: 'Use focused bullets for application map, primary owned object, owned/countable nodes, relationship arrows, cap/frontier, next closure and proof boundary.'
  - id: 'business-graph.legend-relationship-proof-boundary'
    expected: 'Business Flow Graph legend explicitly explains edge meaning and proof-boundary/evidence placement.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'A graph can explain colors but still hide whether arrows are dependencies, submissions, mutations, reopenings or proof boundaries.'
    repairHint: 'Name relationship/edge semantics and state where source/XML/Extent/diff evidence belongs.'
  - id: 'business-graph.html-example-scale'
    expected: 'Business Flow Graph uses calibrated html-ex scale for multi-node application maps.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The graph can pass simple SVG checks while rendering as a tiny horizontal chain or oversized empty panel.'
    repairHint: 'For six or more nodes, use a wide application map or multi-lane viewBox with meaningful node density.'
  - id: 'business-graph.edge-text-clearance'
    expected: 'Business Flow Graph edges do not cross node title/subtitle text.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The graph is visually present but hard to read because connectors collide with labels.'
    repairHint: 'Route edge endpoints to node borders and move labels/curves away from .nt and .ns text baselines.'
  - id: 'business-graph.centered-node-labels'
    expected: 'Business Flow Graph node labels are centered and fit within visible node shapes.'
    artifacts: 'analysis/langgraph-business-understanding.html,analysis/shared-report-reference.css'
    failureMeaning: 'Business nodes can look amateur or ambiguous when labels drift away from their shapes.'
    repairHint: 'Use text-anchor="middle" or shared CSS for .nt/.ns and size node rectangles for their labels.'
  - id: 'business-graph.visible-svg-shapes'
    expected: 'Business Flow Graph applies node/owned/cap/strong classes directly to visible SVG shapes.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'Semantic classes on wrapper groups may not paint the actual shapes, leaving ownership/frontier invisible.'
    repairHint: 'Put node, owned, strong, cap or blocked classes on rendered rect/circle/polygon elements.'
  - id: 'business-graph.declared-edge-variants'
    expected: 'Business Flow Graph uses only edge variants backed by shared CSS.'
    artifacts: 'analysis/langgraph-business-understanding.html,analysis/shared-report-reference.css'
    failureMeaning: 'Ad-hoc edge classes can silently render as plain paths and weaken frontier/application semantics.'
    repairHint: 'Use canonical edge classes such as edge, edge soft, edge dashed, edge frontier or edge cap, or add shared CSS before using a new variant.'
  - id: 'business-graph.no-run-ids-as-nodes'
    expected: 'Business Flow Graph does not expose run_01/run_N labels as business nodes.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The graph has drifted from business understanding into procedural run inventory.'
    repairHint: 'Keep run slots in Proof Mapping, Run Audit and Artifact Index; graph nodes should be application objects, states, actors or frontiers.'
  - id: 'business-graph.no-package-overlay'
    expected: 'Business Flow Graph avoids compact package-overlay strips and adjacent run-token lists.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The graph can become visually cluttered by procedural overlay text instead of structured proof sections.'
    repairHint: 'Move run/package overlay evidence into structured Proof Mapping, Run Audit and Artifact Index rows.'
  - id: 'business-graph.primary-owned-object.truth'
    expected: 'Business Flow Graph declares exactly one primary owned business object and aligns it with package-state.'
    artifacts: 'analysis/langgraph-business-understanding.html,review/package-state.json'
    failureMeaning: 'The graph may visibly mark owned nodes while claiming the wrong thing as business ownership.'
    repairHint: 'Mark one durable package-owned business node as node owned strong; do not mark Extent/XML/diff/MCP gate/report evidence as owned.'
  - id: 'business-graph.proof-artifacts-not-owned'
    expected: 'Business Flow Graph keeps supporting proof artifacts outside owned business nodes.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The report can confuse corroborating evidence with actual product/business ownership.'
    repairHint: 'Keep Extent, XML, diff, run-state, package-state, gate, method ledger and screenshot evidence in Proof Mapping/Run Audit/Artifact Index or proof-boundary legend text.'
  - id: 'business-graph.frontier-report-consistency'
    expected: 'Business Flow Graph capped/frontier node matches package-state frontier and visible cap/legend wording.'
    artifacts: 'analysis/langgraph-business-understanding.html,review/package-state.json'
    failureMeaning: 'The graph can display a frontier node that is not the real next closure object or is also claimed as owned.'
    repairHint: 'Use node cap/blocked for the next closure frontier, keep it not-owned, and echo the same object in Executive Context, Score Overview or Legend.'
  - id: 'business-graph.proof-score-consistency'
    expected: 'Business Flow Graph owned/frontier labels are traceable through Proof Mapping, Score Overview and cap narrative.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The graph can look business-like while inventing labels that the evidence spine does not support.'
    repairHint: 'Align primary owned node text with Proof Mapping/Score Overview and align frontier node text with cap reason, weakest axis or next closure wording.'
  - id: 'report.business-graph.default-open.negative'
    expected: 'The Business Flow Graph must be the single default-open report section.'
    artifacts: 'analysis/langgraph-business-understanding.html,analysis/shared-report-reference.css'
    failureMeaning: 'A final report can be structurally present but hide the primary business map from the reader.'
    repairHint: 'Keep Business Flow Graph open by default and collapse secondary sections behind clear summaries.'
  - id: 'report.final.business-structure'
    expected: 'The final HTML report publishes the canonical business sections and evidence spine.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The final report is not a cold, navigable business package artifact.'
    repairHint: 'Regenerate the final report with Executive Context, graph, score overview, proof mapping, run audit and artifact links.'
  - id: 'report.governance-evidence.final-links'
    expected: 'The final report Artifact Index hyperlinks package-state, root diff, source evolution ledger, close-out, gate, frozen inventory, link audit, manifest and input snapshot.'
    artifacts: 'analysis/langgraph-business-understanding.html,review/root-source-thin-no-index.diff,review/source-evolution-ledger.md,review/frozen-package-inventory.md'
    failureMeaning: 'A package can keep decisive governance artifacts on disk while the final public report cannot reopen them directly.'
    repairHint: 'Add Artifact Index hyperlinks to the package governance spine and rerun MCP close-out.'
  - id: 'report.ai-task-advisor.visible-nonblocking'
    expected: 'The final report publishes the MCP AI Task Advisor section with INFO/WARN guidance and a stable mcp-ai-task-advisor anchor.'
    artifacts: 'analysis/langgraph-business-understanding.html,src/main/resources/skills/mcp/contracts/ai-task-advisor.yml,target/mcp-ai-task-advisor-final-report-section.html'
    failureMeaning: 'A final package can pass hard evidence gates while hiding the non-blocking calibration guidance needed for the next agentic iteration.'
    repairHint: 'Embed McpAiTaskAdvisorRenderer.renderFinalReportSection(...) in langgraph-business-understanding.html; do not convert advisor findings into MCP blockers.'
  - id: 'report.links.local-hrefs-resolve'
    expected: 'Every local report hyperlink resolves inside the frozen package.'
    artifacts: 'analysis/langgraph-business-understanding.html,review/local-link-check.txt'
    failureMeaning: 'The package cannot be reopened reliably from the final report.'
    repairHint: 'Repair or remove broken local hrefs and rerun link validation.'
  - id: 'report.mcp-evidence.final-links'
    expected: 'The final report Artifact Index links the primary MCP package close-out Extent report, gate result, XML and method ledger.'
    artifacts: 'analysis/langgraph-business-understanding.html,validation/mcp/ExtentReport.html,validation/mcp/ExtentReport.sha256,validation/mcp/extent-origin.json,validation/mcp/mcp-gate-result.md,validation/mcp/TEST-TestSuite.xml,validation/mcp/full-mcp-method-ledger.md'
    failureMeaning: 'A package can claim MCP success while hiding, omitting, or replacing the package close-out execution evidence from the final artifact surface.'
    repairHint: 'After testng-mcp-package-closeout.xml finishes, freeze validation/mcp Extent, hash, origin, gate, XML and ledger, then hyperlink all of them from Artifact Index. A broad full sweep is supporting health evidence, not final close-out evidence.'
  - id: 'report.artifact-index.family-grouping'
    expected: 'Artifact Index groups evidence into MCP close-out, run evidence, governance/source evolution and KPI/calibration families, with meaningful statuses.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The report may contain all links but still force reviewers through a flat table full of repeated family labels and linked-proof filler.'
    repairHint: 'A table is fine, but organize it with caption/family headings, divider rows, rowspans or artifact-family blocks; replace generic linked-proof statuses with PASS/count/provenance/freshness details.'
  - id: 'report.proof-mapping.balanced-columns'
    expected: 'Proof Mapping uses a readable table where Source/Business source cells are short business labels, not raw Java paths or long source inventories.'
    artifacts: 'analysis/langgraph-business-understanding.html'
    failureMeaning: 'The report can be technically auditable but visually dominated by a Source column, making Proof Mapping harder to scan than calibrated html-ex examples.'
    repairHint: 'Replace visible source paths with compact labels such as account payment ledger, settlement handshake or staff support response; keep full Java paths in title/href/code audit detail and leave proof artifacts in Diff/State and Execution proof columns.'
  - id: 'report.presentation.shared-css'
    expected: 'The final report reuses the shared reference stylesheet and canonical document chrome.'
    artifacts: 'analysis/langgraph-business-understanding.html,analysis/shared-report-reference.css'
    failureMeaning: 'The report may be visually custom, stale, or hard to compare with html-ex references.'
    repairHint: 'Regenerate the report with shared-report-reference.css and rerun report presentation MCP checks.'
  - id: 'report.template-profile.primary-html-ex'
    expected: 'The final report follows the structural profile learned from the auto-selected reusable docs/html-ex reference: score-card order, opening rhythm, collapse policy, Proof Mapping, Run Audit and Artifact Index.'
    artifacts: 'analysis/langgraph-business-understanding.html,docs/html-ex/README.md,src/main/resources/skills/mcp/contracts/candidate/html-ex-corpus.yml'
    failureMeaning: 'A package can be technically linked but drift from the current report shape expected by final close-out.'
    repairHint: 'Update the final report to the current primary html-ex shape. If the framework standard changed intentionally, replace/update the docs/html-ex reference first, then rerun MCP sanity and final-report closeout.'
  - id: 'score.overall.state-sync.negative'
    expected: 'Score Overview Overall must match package-state truth and remain capped by visible blockers.'
    artifacts: 'review/package-state.json,analysis/langgraph-business-understanding.html'
    failureMeaning: 'The report can inflate Overall independently from canonical package state.'
    repairHint: 'Synchronize score cards, package-state, cap reason, and final report before rerunning MCP.'
  - id: 'score.overview.canonical-axes'
    expected: 'Score Overview uses canonical business axes and keeps Overall/cap explainable.'
    artifacts: 'analysis/langgraph-business-understanding.html,review/package-state.json'
    failureMeaning: 'The report score can become decorative or inflated instead of evidence-backed.'
    repairHint: 'Regenerate Score Overview from package-state, cap reason, weakest axis and proof artifacts.'

