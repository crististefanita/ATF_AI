schemaVersion: 1
contracts:
  - id: 'real-test-countability.config-methods.accepted'
    expected: 'Five real @Test methods pass even when TestNG XML also records config lifecycle methods.'
    artifacts: 'runs/run_##/validation/testng-results.xml,src/test/java/**/*.java'
    failureMeaning: 'MCP would penalize native TestNG XML for recording @BeforeClass/setUp/tearDown.'
    repairHint: 'Filter is-config=true entries before counting XML methods.'
  - id: 'real-test-countability.four-real-tests.rejected'
    expected: 'Four real @Test methods do not satisfy a five-test run-state target.'
    artifacts: 'runs/run_##/validation/testng-results.xml,runs/run_##/review/run-state.json'
    failureMeaning: 'Missing real test methods could be hidden behind setup/teardown entries.'
    repairHint: 'Compare run-state tests_produced to non-config XML test methods only.'
  - id: 'real-test-countability.html-ex-source-drift.warning'
    expected: 'Historical html-ex packages do not fail latest-package close-out only because live source was renamed after the example was frozen.'
    artifacts: 'docs/html-ex/**,runs/run_##/validation/testng-results.xml,src/test/java/**/*.java'
    failureMeaning: 'The html-ex corpus would become unstable whenever a demo source class is refactored after promotion.'
    repairHint: 'Classify source/method drift under MCP/html-ex as corpus warning unless the matching source snapshot is supplied.'
  - id: 'run.diff.duplicate-all.negative'
    expected: 'Every counted run diff must teach a distinct run mutation instead of repeating the same patch.'
    artifacts: 'runs/run_##/review/thin-no-index.diff'
    failureMeaning: 'The package can pretend to have five iterations while publishing one repeated diff.'
    repairHint: 'Keep common foundation in the root diff and publish focused per-run mutations.'
  - id: 'run.diff.feedback.reopenable'
    expected: 'Each run diff and feedback artifact is substantive enough for another agent to reopen.'
    artifacts: 'runs/run_##/review/thin-no-index.diff,runs/run_##/review/feedback.md'
    failureMeaning: 'The run history becomes a shallow breadcrumb instead of actionable evidence.'
    repairHint: 'Restore the run diff and feedback note with business claim, changed source and next action.'
  - id: 'run.diff.history.distinct'
    expected: 'Run diffs are cold-distinct and show separate learning slices.'
    artifacts: 'runs/run_##/review/thin-no-index.diff'
    failureMeaning: 'Multiple runs may be duplicates or copied evidence.'
    repairHint: 'Regenerate distinct run diffs from each run slot or collapse duplicate runs out of the count.'
  - id: 'run.diff.progression.compiled'
    expected: 'Per-run diffs expose parseable source/test deltas and root diff compiles the final mutation.'
    artifacts: 'review/root-source-thin-no-index.diff,runs/run_##/review/thin-no-index.diff'
    failureMeaning: 'The package can show activity per run while the final source delta does not prove real progress.'
    repairHint: 'Regenerate focused per-run diffs from each run and regenerate root-source-thin-no-index.diff from the final project delta.'
  - id: 'run.diff.progression.no-source-files.negative'
    expected: 'Every counted run diff must expose parseable src/** source/test deltas.'
    artifacts: 'runs/run_##/review/thin-no-index.diff'
    failureMeaning: 'A run can publish narrative activity without auditable source progress.'
    repairHint: 'Regenerate the run diff from git/apply_patch source changes, not from comments or summaries.'
  - id: 'run.diff.progression.root-compilation.negative'
    expected: 'Root diff must compile source/test deltas published by the kept run diffs.'
    artifacts: 'review/root-source-thin-no-index.diff,runs/run_##/review/thin-no-index.diff'
    failureMeaning: 'The final package can hide or lose the source evolution produced by individual runs.'
    repairHint: 'Regenerate root-source-thin-no-index.diff from the final source tree after all kept runs.'
  - id: 'run.extent.exists'
    expected: 'Every counted run publishes a per-run Extent report as execution evidence.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'The package claims execution without a reopenable per-run report.'
    repairHint: 'Rerun the affected run through Maven and freeze the generated Extent report.'
  - id: 'run.extent.final-state-screenshot'
    expected: 'When framework.properties requires final-state screenshots, Extent exposes labeled visible final-state proof.'
    artifacts: 'review/framework.properties,runs/run_##/validation/**/ExtentReport.html'
    failureMeaning: 'Run-state can overclaim UI proof that the report does not visibly contain.'
    repairHint: 'Rerun UI with final-state screenshot capture and label the screenshot evidence in Extent.'
  - id: 'run.extent.framework-runtime-audit.accepted'
    expected: 'Framework-generated runtime audit sections are allowed inside native Extent evidence.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'MCP would punish transparent listener/runtime audit panels as if they were manual proof injection.'
    repairHint: 'Classify runtime audit separately from manual package/final-report proof vocabulary.'
  - id: 'run.extent.generated.substantive'
    expected: 'Every per-run Extent report is generated and substantive, not a tiny placeholder.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'The package has an Extent filename without meaningful execution content.'
    repairHint: 'Rerun the affected slot and freeze the generated report with tests, logs and evidence.'
  - id: 'run.extent.hash-mismatch.negative'
    expected: 'The frozen SHA-256 snapshot must match the exact ExtentReport.html bytes.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html,runs/run_##/validation/reports/ExtentReport.sha256'
    failureMeaning: 'The report may have been changed after the command snapshot.'
    repairHint: 'Rerun Maven and copy the report with its immediate SHA-256 snapshot.'
  - id: 'run.extent.manual-proof-injection.negative'
    expected: 'Per-run Extent must remain execution evidence and must not contain final-report proof vocabulary.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html,runs/run_##/validation/reports/ExtentReport.sha256,runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'An agent can cosmetically turn an execution report into a narrative report.'
    repairHint: 'Delete repaired Extent HTML and rerun Maven to regenerate the report from execution.'
  - id: 'run.extent.manual-proof-section.rejected'
    expected: 'Manual final-report proof vocabulary remains forbidden inside per-run Extent evidence.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'An agent could turn execution evidence into a cosmetic business report after the run.'
    repairHint: 'Keep Proof Mapping, Score Overview and Business Flow Graph in the final report, not in run Extent.'
  - id: 'run.extent.maven-provenance'
    expected: 'Every per-run Extent report has sha256 and origin metadata tying it to Maven execution.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html,runs/run_##/validation/reports/ExtentReport.sha256,runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'The frozen report may have been edited or replaced after execution.'
    repairHint: 'Regenerate sha256/origin from the executed report or rerun Maven and freeze the new evidence.'
  - id: 'run.extent.mode.component-adapter-without-fallback.accepted'
    expected: 'A component/adapter Extent report stays valid without visible Overview fallback content.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'MCP would force non-business diagnostic text into Extent Overview.'
    repairHint: 'Keep component/adapter report mode as machine-readable metadata.'
  - id: 'run.extent.mode.component-adapter.accepted'
    expected: 'MCP classifies component/adapter Extent reports without demanding runtime audit sections.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'MCP would reject valid adapter/component Extent reports that use the ATF shell but have no TestNG runtime ledger.'
    repairHint: 'Use the ATF_EXTENT_REPORT_MODE marker instead of visible fallback content.'
  - id: 'run.extent.mode.runtime-audited.requires-ledger'
    expected: 'A runtime-audited Extent mode marker must be backed by runtime audit sections.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'MCP would trust a forged runtime-audited marker without audit data.'
    repairHint: 'Publish the runtime audit ledger or declare component-adapter mode.'
  - id: 'run.extent.native-spark-shell.negative'
    expected: 'Per-run Extent must preserve the native Spark shell instead of copying a few Spark-looking class names.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html,runs/run_##/validation/reports/ExtentReport.sha256,runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'A custom proof HTML can pass weak token checks by defining spark-style.css, dashboard-view and test-view itself.'
    repairHint: 'Store the real Extent Spark report generated by TestListener; do not replace it with a standalone proof page.'
  - id: 'run.extent.native-testlistener-provenance'
    expected: 'Per-run Extent reports are native Maven/TestNG/TestListener Spark output, not post-run writer HTML.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html,runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'A package can replace Extent with a custom proof page that only imitates Spark tokens.'
    repairHint: 'Freeze the Extent report produced by the UI test command; do not run exec:java proof writers over ExtentReport.html.'
  - id: 'run.extent.no-external-screenshot-folder'
    expected: 'Per-run Extent reports embed screenshot evidence instead of referencing external screenshots folders.'
    artifacts: 'runs/run_##/validation/**/ExtentReport.html'
    failureMeaning: 'The frozen report is not portable as single-file evidence.'
    repairHint: 'Regenerate the report with embedded base64 screenshots or copy a self-contained report artifact.'
  - id: 'run.extent.no-manual-proof-injection'
    expected: 'Per-run Extent reports do not contain final-report vocabulary injected after execution.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'Execution evidence may have been manually embellished with package/report claims.'
    repairHint: 'Keep proof mapping and business graphs in final report artifacts, not inside run Extent evidence.'
  - id: 'run.extent.origin-exit-code-alias.accepted'
    expected: 'MCP accepts exitCode=0 as valid Maven exit metadata in extent-origin.json.'
    artifacts: 'runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'MCP would reject a valid frozen package because it only accepts one JSON naming convention.'
    repairHint: 'Validate the exit-code concept and allow exit, exit_code, or exitCode aliases.'
  - id: 'run.extent.origin-exit.invalid.negative'
    expected: 'extent-origin.json must prove the Maven test command exited with code 0.'
    artifacts: 'runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'A failing Maven run can be frozen as if it were successful evidence.'
    repairHint: 'Rerun Maven, require exit code 0, then freeze Extent/hash/origin together.'
  - id: 'run.extent.origin-post-run-edit.negative'
    expected: 'Per-run Extent origin metadata must prove Maven-native bytes and must reject any declared agent edit.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html,runs/run_##/validation/reports/ExtentReport.sha256,runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'An agent can edit Extent, recompute sha/origin, and pass unless edited_by_agent/edit_reason is a blocker.'
    repairHint: 'Discard the edited Extent copy and rerun Maven/TestNG; do not freeze any Extent origin that declares post-run edits.'
  - id: 'run.extent.origin-post-run-writer.negative'
    expected: 'Per-run Extent origin must name the Maven test execution, not a support writer that rewrites Extent after execution.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html,runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'A package can publish a valid hash for a custom proof page generated after tests already ran.'
    repairHint: 'Freeze the Extent output from the UI test run; reject exec:java/-DskipTests proof writers as Extent provenance.'
  - id: 'run.extent.origin-sha256.invalid.negative'
    expected: 'extent-origin.json must publish a valid 64-character SHA-256 for ExtentReport.html.'
    artifacts: 'runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'A package can claim provenance without binding origin metadata to exact report bytes.'
    repairHint: 'Freeze ExtentReport.html and regenerate extent-origin.json with the exact report SHA-256.'
  - id: 'run.extent.origin-size-mismatch.negative'
    expected: 'extent-origin.json size must equal ExtentReport.html byte size.'
    artifacts: 'runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'An agent can recompute a hash but leave stale freeze metadata that no longer describes the artifact.'
    repairHint: 'Regenerate origin metadata from the exact ExtentReport.html bytes copied into the package.'
  - id: 'run.extent.origin-timestamp.invalid.negative'
    expected: 'extent-origin.json timestamp must be parseable ISO date-time metadata.'
    artifacts: 'runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'Freeze time cannot be audited if the origin timestamp is a loose human note.'
    repairHint: 'Write ISO timestamps such as 2026-06-28T11:25:44+03:00 in extent-origin.json.'
  - id: 'run.extent.origin.not-maven-test.negative'
    expected: 'extent-origin.json command must be a real Maven test execution command.'
    artifacts: 'runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'A package can freeze Extent bytes produced by a compile/copy/proof command instead of tests.'
    repairHint: 'Use the Maven TestNG/Surefire command that generated ExtentReport.html, not a post-run utility command.'
  - id: 'run.extent.origin.skip-tests-false.accepted'
    expected: 'MCP accepts Maven test provenance that explicitly sets -DskipTests=false.'
    artifacts: 'runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'MCP would reject a legitimate Maven test command because it token-scans skipTests too broadly.'
    repairHint: 'Treat skipTests=false as valid and block only commands that actually disable tests.'
  - id: 'run.extent.post-run-audit-injection.negative'
    expected: 'Per-run Extent may contain framework runtime audit, but explicit post-run repair markers are not accepted.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html,runs/run_##/validation/reports/ExtentReport.sha256,runs/run_##/validation/reports/extent-origin.json'
    failureMeaning: 'An agent can edit Extent, recompute hashes, and still hide cosmetic post-run report surgery.'
    repairHint: 'Do not patch ExtentReport.html. Rerun Maven and freeze the generated report plus original provenance.'
  - id: 'run.extent.proof-class.scoring'
    expected: 'Per-run Extent proof class is published and reflected in scoring/cap language.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html,README.md,analysis/langgraph-business-understanding.html,review/package-state.json'
    failureMeaning: 'Weak synthetic or standalone proof can be scored like strong UI-owned evidence.'
    repairHint: 'Publish the proof class and lower/justify scoring when Extent evidence is weak.'
  - id: 'run.extent.screenshot-img.accepted'
    expected: 'Classic embedded img screenshots are still accepted.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'The new native-anchor support could accidentally break the original img path.'
    repairHint: 'Keep screenshot evidence polymorphic across img and anchor media.'
  - id: 'run.extent.screenshot-missing.rejected'
    expected: 'HTML without embedded screenshot media is not accepted as UI proof.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'MCP would accept a report shell without local UI evidence.'
    repairHint: 'Require at least one useful embedded screenshot data URI in img or native media anchor form.'
  - id: 'run.extent.screenshot-native-anchor.accepted'
    expected: 'Native Extent media anchors with embedded data-image href are accepted as screenshot proof.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'MCP would reject correct Extent Spark output just because it is not an img tag.'
    repairHint: 'Validate embedded screenshot media, not a single accidental HTML tag shape.'
  - id: 'run.extent.screenshot.browser-visible'
    expected: 'MCP accepts only embedded screenshot media that is visible or reopenable in a real browser.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'A hidden final-state screenshot can be overclaimed as visual evidence.'
    repairHint: 'Keep the screenshot media visible/reopenable in Extent Spark and reject hidden proof placeholders.'
  - id: 'run.extent.single-file-proof'
    expected: 'Per-run Extent reports are single-file proof artifacts without runtime Spark asset dependencies.'
    artifacts: 'runs/run_##/validation/reports/ExtentReport.html'
    failureMeaning: 'The run report can break when moved outside the Maven target directory.'
    repairHint: 'Freeze a self-contained Extent report or remove external Spark asset dependencies.'
  - id: 'run.independence.auditable'
    expected: 'Runs expose enough independent artifacts to prove they are not one copied execution.'
    artifacts: 'runs/run_##/validation/testng-results.xml,runs/run_##/review/run-state.json'
    failureMeaning: 'The package may count repeated or non-independent run evidence.'
    repairHint: 'Freeze independent XML, state, diff and report artifacts for each run slot.'
  - id: 'run.learning.progression.negative'
    expected: 'Each run learning artifact must explain progression from prior evidence.'
    artifacts: 'runs/run_##/SUMMARY.md,runs/run_##/review/business-understanding.md'
    failureMeaning: 'A run can be technically present but historically non-teachable.'
    repairHint: 'Regenerate the run summary with prior-run delta, new evidence, and business learning.'
  - id: 'run.score-support.delta-quality'
    expected: 'Published per-run score support meets RUN_EXPECTED_DELTA_QUALITY when a score is claimed.'
    artifacts: 'runs/run_##/review/run-state.json,runs/run_##/review/score-support.md'
    failureMeaning: 'A run can inflate package quality without enough delta evidence.'
    repairHint: 'Lower the run score or add concrete score support tied to source, XML, Extent and diff.'
  - id: 'run.state.business-verdict'
    expected: 'Every run-state publishes produced/passed test counts and a business verdict.'
    artifacts: 'runs/run_##/review/run-state.json'
    failureMeaning: 'The run result cannot be interpreted as countable, diagnostic or blocked evidence.'
    repairHint: 'Regenerate run-state.json from the executed run and include counts plus business status.'
  - id: 'run.state.required.negative'
    expected: 'Every counted run must publish run-state evidence with test accounting and business verdict.'
    artifacts: 'runs/run_##/review/run-state.json,runs/run_##/review/thin-no-index.diff,runs/run_##/SUMMARY.md'
    failureMeaning: 'A run can appear in the package without a cold state artifact that future agents can audit.'
    repairHint: 'Regenerate the affected run with run-state.json, focused diff, summary, execution proof, and verdict.'
  - id: 'run.state.target-counts'
    expected: 'Each run-state publishes expected, produced and passed test counts plus target business status.'
    artifacts: 'runs/run_##/review/run-state.json'
    failureMeaning: 'Runtime accounting and run-state accounting can drift.'
    repairHint: 'Update run-state.json from the run XML and runtime target values.'
  - id: 'run.window.artifacts.exist'
    expected: 'Every expected run slot has state, diff, command result and validation artifacts.'
    artifacts: 'runs/run_##/review/run-state.json,runs/run_##/review/thin-no-index.diff,runs/run_##/validation/command-result.md'
    failureMeaning: 'The run window cannot be reopened as historical evidence.'
    repairHint: 'Restore missing run artifacts or rerun the affected slot from Maven.'
  - id: 'run.xml.config-methods-ignored'
    expected: 'TestNG XML countability ignores lifecycle/config methods and counts only real passed test methods.'
    artifacts: 'runs/run_##/validation/testng-results.xml'
    failureMeaning: 'MCP would penalize native TestNG XML that records @BeforeClass/setUp/tearDown.'
    repairHint: 'Filter test-method entries with is-config=true before comparing XML, Extent and run-state counts.'
  - id: 'run.xml.java-method.countability'
    expected: 'TestNG XML methods map back to real Java @Test methods in the current project.'
    artifacts: 'runs/run_##/validation/testng-results.xml,src/test/java'
    failureMeaning: 'The run can claim machine execution for Java tests that no longer exist.'
    repairHint: 'Regenerate XML from current source or restore the referenced Java test methods.'
  - id: 'run.xml.real-method-count-drift.rejected'
    expected: 'A run with only four real TestNG methods remains below a five-test target even if config methods exist.'
    artifacts: 'runs/run_##/validation/testng-results.xml,runs/run_##/review/run-state.json'
    failureMeaning: 'MCP could hide missing real tests behind setup/teardown entries.'
    repairHint: 'Compare target counts only to non-config TestNG methods.'
  - id: 'run.xml.target.no-failures'
    expected: 'Each run TestNG XML matches the runtime target and contains no failed/skipped test results.'
    artifacts: 'runs/run_##/validation/testng-results.xml'
    failureMeaning: 'The package may count a run that did not actually satisfy its Maven execution target.'
    repairHint: 'Rerun the affected slot and freeze the resulting TestNG XML only after it is green.'

