schemaVersion: 1
contracts:
  - id: 'diff.extractor.quoted-windows-paths'
    expected: 'Quoted git paths with Windows separators are normalized to src/** paths.'
    artifacts: 'review/root-source-thin-no-index.diff'
    failureMeaning: 'Protected source and progress rules can miss files in quoted git diffs.'
    repairHint: 'Normalize quoted a/b paths and backslashes before source governance checks.'
  - id: 'mcp.extent.frozen-report.details'
    expected: 'The frozen MCP Extent report contains readable contract details and concrete artifact names.'
    artifacts: 'validation/mcp/ExtentReport.html'
    failureMeaning: 'The saved MCP report is a green/red shell without enough audit context.'
    repairHint: 'Rerun MCP with StepLogger contract details and freeze the generated Extent report.'
  - id: 'mcp.external-package.explicit-source-root-definitive'
    expected: 'When -Dmcp.project.root is explicit, missing diff-touched source files remain blocker-level evidence.'
    artifacts: '-Dmcp.project.root,review/root-source-thin-no-index.diff'
    failureMeaning: 'A real audited source root could miss files without MCP failing the package.'
    repairHint: 'Keep source-missing as blocker only when the audited project root is known.'
  - id: 'mcp.external-package.source-root-required'
    expected: 'External package audits without -Dmcp.project.root classify live source checks as requires-source-root warnings.'
    artifacts: '-Dmcp.package.root,-Dmcp.project.root,review/root-source-thin-no-index.diff'
    failureMeaning: 'MCP can compare an ATF_name package diff against the validator tree and report false source-missing blockers.'
    repairHint: 'Pass -Dmcp.project.root=<audited-project-root> for definitive source consistency checks.'
  - id: 'mcp.gate-result.freshness'
    expected: 'Frozen mcp-gate-result.md agrees with the current validator state.'
    artifacts: 'validation/mcp/mcp-gate-result.md'
    failureMeaning: 'The package can publish stale PASS/PENDING status after validator rules or artifacts changed.'
    repairHint: 'Rerun MCP latest and rewrite mcp-gate-result.md from the current result.'
  - id: 'mcp.gate.final-closeout.counts-cross-check'
    expected: 'MCP Extent, XML, gate result and method ledger must publish the same total/pass/skip/failure/error counts.'
    artifacts: 'validation/mcp/ExtentReport.html,validation/mcp/TEST-TestSuite.xml,validation/mcp/full-mcp-method-ledger.md,validation/mcp/mcp-gate-result.md'
    failureMeaning: 'An agent could publish a complete-looking report that does not represent the same MCP execution as XML/ledger.'
    repairHint: 'Freeze all validation/mcp artifacts from the same Maven Mcp*Test execution.'
  - id: 'mcp.gate.final-closeout.extent-hash-provenance'
    expected: 'The frozen MCP Extent report hash must match validation/mcp/ExtentReport.sha256.'
    artifacts: 'validation/mcp/ExtentReport.html,validation/mcp/ExtentReport.sha256,validation/mcp/extent-origin.json'
    failureMeaning: 'An agent could replace the final MCP Extent report after the gate was recorded.'
    repairHint: 'Regenerate ExtentReport.sha256 and extent-origin.json from the exact final MCP Extent bytes.'
  - id: 'mcp.gate.final-closeout.extent-required'
    expected: 'A PASS MCP gate is rejected when validation/mcp/ExtentReport.html is missing.'
    artifacts: 'validation/mcp/ExtentReport.html,validation/mcp/mcp-gate-result.md'
    failureMeaning: 'An agent could close with a green markdown gate while hiding the complete Extent execution report.'
    repairHint: 'Freeze the latest MCP package close-out Extent report beside the gate result before close-out.'
  - id: 'mcp.gate.final-closeout.extent-substantive'
    expected: 'The frozen MCP Extent report must be substantive MCP suite evidence, not a toy HTML shell.'
    artifacts: 'validation/mcp/ExtentReport.html'
    failureMeaning: 'An agent could satisfy the filename contract with a decorative fake report.'
    repairHint: 'Copy the real Extent report produced by the full Mcp*Test Maven run.'
  - id: 'mcp.gate.final-closeout.runtime-audited-extent-required'
    expected: 'The final frozen MCP Extent report uses the standard runtime-audited ATF shell, never component-adapter mode.'
    artifacts: 'validation/mcp/ExtentReport.html'
    failureMeaning: 'A package could close with an internal component-style Extent report instead of the canonical final runtime report.'
    repairHint: 'Run testng-mcp-package-closeout.xml through the normal TestListener/Extent runtime and freeze the runtime-audited ExtentReport.html.'
  - id: 'mcp.gate.final-closeout.ledger-placeholders-rejected'
    expected: 'The final MCP method ledger contains resolved classes/methods, not template placeholders.'
    artifacts: 'validation/mcp/full-mcp-method-ledger.md'
    failureMeaning: 'A generated package could look complete while publishing $class/$method placeholders.'
    repairHint: 'Generate the ledger from real TestNG/Extent data after the Maven close-out run.'
  - id: 'mcp.gate.final-closeout.missing-frozen-evidence-blocked'
    expected: 'Final MCP validation blocks close-out when validation/mcp artifacts are not frozen.'
    artifacts: 'validation/mcp/mcp-gate-result.md'
    failureMeaning: 'An agent could finish a package without publishing the MCP package close-out Extent report and gate evidence.'
    repairHint: 'Run testng-mcp-package-closeout.xml, freeze validation/mcp/ExtentReport.html, gate result, XML and method ledger, then close out.'
  - id: 'mcp.gate.final-closeout.readme-links-required'
    expected: 'README links the final MCP Extent, gate result, XML and method ledger whenever validation/mcp exists.'
    artifacts: 'README.md,validation/mcp/ExtentReport.html,validation/mcp/mcp-gate-result.md'
    failureMeaning: 'The final HTML can be correct while README hides the MCP package close-out execution evidence.'
    repairHint: 'Add explicit README hyperlinks to validation/mcp/ExtentReport.html, mcp-gate-result.md, TEST-TestSuite.xml or testng-results.xml, and full-mcp-method-ledger.md.'
  - id: 'mcp.gate.final-closeout.required-overrides-phase1'
    expected: 'Required frozen evidence mode overrides any phase-1 pending flag.'
    artifacts: 'validation/mcp/mcp-gate-result.md'
    failureMeaning: 'A publishable package could bypass final close-out evidence by leaving a phase-1 flag on.'
    repairHint: 'When finalizing, require frozen evidence and publish validation/mcp artifacts before closing.'
  - id: 'mcp.gate.final-closeout.skip-reason-command-drift'
    expected: 'MCP evidence rejects a skip reason that contradicts the published command.'
    artifacts: 'validation/mcp/mcp-gate-result.md,validation/mcp/TEST-TestSuite.xml'
    failureMeaning: 'A gate could claim -Dmcp.package.root while XML says tests skipped because the package root was missing.'
    repairHint: 'Regenerate gate/XML from the same Maven invocation and do not mix stale skip output.'
  - id: 'mcp.gate.final-closeout.skipped-cap-required'
    expected: 'Accepted skipped MCP profile methods cap the package below 95.'
    artifacts: 'review/package-state.json,validation/mcp/full-mcp-method-ledger.md'
    failureMeaning: 'A package could claim 95+ while admitting final MCP skipped methods.'
    repairHint: 'Either rerun a no-skip close-out profile or publish a cap below 95 when skips are accepted.'
  - id: 'mcp.gate.final-closeout.skipped-package-class-named'
    expected: 'If the final MCP Extent report shows skipped package-audit classes, the ledger names those classes explicitly.'
    artifacts: 'validation/mcp/ExtentReport.html,validation/mcp/full-mcp-method-ledger.md'
    failureMeaning: 'The final report can show McpLatestPackage* skipped while the ledger hides which close-out checks were not executed.'
    repairHint: 'List skipped package-audit classes in full-mcp-method-ledger.md with reason and accepted=true/false.'
  - id: 'mcp.gate.final-closeout.skipped-profile-disclosure-required'
    expected: 'Final MCP close-out rejects skipped tests unless the ledger publishes profile/class, reason and acceptance.'
    artifacts: 'validation/mcp/ExtentReport.html,validation/mcp/full-mcp-method-ledger.md,validation/mcp/mcp-gate-result.md'
    failureMeaning: 'An agent could hide unexecuted package-audit checks behind a large skipped count.'
    repairHint: 'Publish full-suite discovered/executed/skipped counts and a skipped profile/class ledger with reason and accepted=true/false.'
  - id: 'mcp.gate.final-closeout.skipped-profile-visible-in-final-report'
    expected: 'When final MCP evidence contains skipped methods, langgraph-business-understanding.html publishes skipped count, reason, accepted=true, cap and ledger link.'
    artifacts: 'analysis/langgraph-business-understanding.html,validation/mcp/ExtentReport.html,validation/mcp/full-mcp-method-ledger.md'
    failureMeaning: 'An agent can close with a green MCP ledger while the public final report hides why methods were skipped.'
    repairHint: 'Add a visible MCP evidence row/section to the final report with skipped count, profile/precondition reason, accepted=true, score cap and full-mcp-method-ledger.md hyperlink.'
  - id: 'mcp.gate.final-closeout.summary-visible-in-final-report'
    expected: 'Final report states the MCP package-closeout subcollection and publishes total/passed plus zero failures and errors.'
    artifacts: 'analysis/langgraph-business-understanding.html,validation/mcp/mcp-gate-result.md,validation/mcp/TEST-TestSuite.xml'
    failureMeaning: 'An agent can freeze a correct MCP close-out run while the public final report hides which MCP subset actually passed.'
    repairHint: 'Add a visible MCP close-out row/section: testng-mcp-package-closeout.xml, total, passed, 0 failures and 0 errors.'
  - id: 'mcp.gate.final-closeout.origin-command-visible'
    expected: 'Final report hyperlinks validation/mcp/extent-origin.json and visibly publishes a sanitized Maven close-out command; extent-origin.json keeps the exact absolute command.'
    artifacts: 'analysis/langgraph-business-understanding.html,validation/mcp/ExtentReport.html,validation/mcp/extent-origin.json'
    failureMeaning: 'A package can claim MCP PASS while either hiding command provenance or leaking local workspace paths in the public business report.'
    repairHint: 'Show mvn, testng-mcp-package-closeout.xml, -Dmcp.package.root=<package-root> and -Dmcp.project.root=<project-root> in the final report, then link extent-origin.json for the exact absolute command, exit code and SHA.'
  - id: 'mcp.gate.final-closeout.xml-profile-required'
    expected: 'The frozen validation/mcp XML is produced by testng-mcp-package-closeout.xml, not a full/candidate/mixed profile.'
    artifacts: 'validation/mcp/TEST-TestSuite.xml,validation/mcp/extent-origin.json,validation/mcp/mcp-gate-result.md'
    failureMeaning: 'An agent can publish a close-out summary while the primary XML/Extent evidence still comes from the full MCP health sweep.'
    repairHint: 'Regenerate validation/mcp from the canonical package close-out command and replace the primary XML/Extent artifacts.'
  - id: 'mcp.gate.full-sweep.skip-reason-not-command-proof'
    expected: 'The command/skip contradiction check compares real origin/gate commands, not arbitrary skip text.'
    artifacts: 'validation/mcp/extent-origin.json,validation/mcp/mcp-gate-result.md,validation/mcp/TEST-TestSuite.xml'
    failureMeaning: 'A full sweep with accepted package-audit precondition skips can be mislabeled as contradictory because the skip reason itself contains -Dmcp.package.root.'
    repairHint: 'Read command evidence from extent-origin.json and the gate command line only; treat XML skip messages as skip reasons, not command proof.'
  - id: 'mcp.gate.full-sweep.skipped-profile-disclosed-secondary-only'
    expected: 'Full MCP health sweep skips can be disclosed as secondary evidence, but cannot become final close-out evidence.'
    artifacts: 'validation/mcp/ExtentReport.html,validation/mcp/full-mcp-method-ledger.md,validation/mcp/mcp-gate-result.md,analysis/langgraph-business-understanding.html'
    failureMeaning: 'An agent can mistake explained full-sweep skips for a clean final close-out.'
    repairHint: 'Keep full-sweep skips visible as health evidence, then rerun testng-mcp-package-closeout.xml with 0 skipped for final close-out.'
  - id: 'mcp.gate.package-closeout'
    expected: 'The frozen MCP gate uses package close-out evidence, not a reassuring latest-only subset.'
    artifacts: 'validation/mcp/mcp-gate-result.md,validation/mcp/ExtentReport.html'
    failureMeaning: 'The package may present partial MCP green as publishable validation.'
    repairHint: 'Run and freeze testng-mcp-package-closeout.xml for publishable close-out; use testng-mcp-full.xml only as supporting health evidence unless score is capped.'
  - id: 'mcp.gate.package-closeout.skipped-forbidden'
    expected: 'Package close-out profile with skipped MCP methods is forbidden as final publishability evidence.'
    artifacts: 'validation/mcp/extent-origin.json,review/package-state.json'
    failureMeaning: 'A final close-out run could preserve skipped package-audit methods while still claiming publishability.'
    repairHint: 'Rerun testng-mcp-package-closeout.xml with explicit package root until it has 0 skipped, 0 failures and 0 errors.'
  - id: 'mcp.gate.two-phase.phase1-explicit-warning'
    expected: 'Phase-1 pending MCP validation is allowed only when explicitly enabled.'
    artifacts: 'validation/mcp/mcp-gate-result.md'
    failureMeaning: 'A hidden default warning would let an agent close a final package without MCP evidence.'
    repairHint: 'Use -Dmcp.frozen.evidence.phase1.allowed=true only for internal pre-freeze diagnostics, never for final close-out.'
  - id: 'mcp.package-audit.cross-project-preflight'
    expected: 'Package-audit identifies external package roots without -Dmcp.project.root before heavy source checks run.'
    artifacts: '-Dmcp.package.root,-Dmcp.project.root,testng-mcp-package-audit.xml'
    failureMeaning: 'The package-audit suite can run source-dependent checks against the validator project tree.'
    repairHint: 'Keep McpPackageAuditSuiteInterceptor and preflight aligned with McpSourceAuditScope.'
  - id: 'mcp.package-audit.preflight.input-contract'
    expected: 'Package audit/close-out requires an explicit package root, and an explicit package audit must schedule the full publishability suite, not only the preflight method.'
    artifacts: '-Dmcp.package.root,src/test/resources/skills/mcp/testng-mcp-package-audit.xml,src/test/resources/skills/mcp/testng-mcp-package-closeout.xml'
    failureMeaning: 'A Maven run can look green after executing only preflight/metadata checks while the heavy latest-package validators never ran.'
    repairHint: 'Run self profile for validator health, or pass -Dmcp.package.root=<package-root> and -Dmcp.project.root=<project-root> so package-audit/package-closeout schedules all publishability classes.'
  - id: 'mcp.package-audit.context-cache.reuses-snapshot'
    expected: 'Repeated latest-package assertions inside one Maven close-out reuse the same loaded package audit context.'
    artifacts: 'McpPackageAuditContext.java,McpPackageAuditValidation.java,testng-mcp-package-closeout.xml'
    failureMeaning: 'The close-out suite can reparse and revalidate the same package for every @Test method, turning 92 contract checks into a multi-minute gate.'
    repairHint: 'Keep McpPackageAuditContext cached by project root and package root for the lifetime of the JVM unless the root changes or reset is explicit.'
  - id: 'mcp.package-audit.context-cache.keyed-by-root'
    expected: 'The audit context cache is keyed by both project root and package root.'
    artifacts: '-Dmcp.project.root,-Dmcp.package.root,McpPackageAuditContext.java'
    failureMeaning: 'A focused rerun could accidentally validate stale evidence from a previous package root.'
    repairHint: 'Normalize project/package roots into the cache key and reload when either root changes.'
  - id: 'mcp.package-audit.context-cache.reset-after-artifact-sync'
    expected: 'A test-only reset hook forces a fresh package audit after validation/mcp artifacts are rewritten in the same JVM.'
    artifacts: 'McpPackageAuditContext.java,validation/mcp/ExtentReport.html,validation/mcp/mcp-gate-result.md'
    failureMeaning: 'Artifact synchronization tooling could keep reading stale close-out evidence after replacing Extent/XML/gate files.'
    repairHint: 'Call the explicit reset hook in tests/tools that mutate package artifacts inside one JVM; normal Maven close-out processes get a fresh JVM.'
  - id: 'mcp.package-root.local-latest-fallback'
    expected: 'Local MCP development may resolve latest docs/out timestamp when no explicit package root is required.'
    artifacts: 'docs/out/<timestamp>'
    failureMeaning: 'Developer smoke runs would become unnecessarily hard to execute.'
    repairHint: 'Keep latest fallback available unless mcp.package.root.required=true is set.'
  - id: 'mcp.package-root.strict-explicit-accepted'
    expected: 'Strict MCP gate mode accepts an explicit package root and never silently switches to latest.'
    artifacts: '-Dmcp.package.root'
    failureMeaning: 'The gate might validate a different package than the command claims.'
    repairHint: 'Resolve relative package roots against project root and absolute roots as-is.'
  - id: 'mcp.package-root.strict-explicit-required'
    expected: 'MCP gate/CI can disable latest fallback and require -Dmcp.package.root=<timestamp>.'
    artifacts: '-Dmcp.package.root,-Dmcp.package.root.required'
    failureMeaning: 'A gate PASS can be replayed against a different latest package.'
    repairHint: 'Set -Dmcp.package.root=<audited package> for publishable MCP gates.'
  - id: 'mcp.report-profile.classloading.self'
    expected: 'Report profile model/assertion classes load through the TestNG context classloader before any package audit starts.'
    artifacts: 'src/main/java/com/ai/skills/mcp/validation/profile,src/main/java/com/ai/skills/mcp/validation/report'
    failureMeaning: 'A NoClassDefFoundError in latest-package report tests can be mistaken for a package-quality failure.'
    repairHint: 'Fix MCP classpath/static initialization before running package-audit suites.'
  - id: 'mcp.rule-metadata.catalog.negative'
    expected: 'Every executable MCP rule must expose unique contract metadata and a repair narrative.'
    artifacts: 'src/main/java/com/ai/skills/mcp/rules,src/main/java/com/ai/skills/mcp/contract/McpRuleCatalog.java'
    failureMeaning: 'An MCP rule can execute without being discoverable or pedagogic for future agents.'
    repairHint: 'Register the rule in McpRuleCatalog and provide id, category, why, artifact, and repair hint metadata.'
  - id: 'mcp.source-audit-scope.rule-guardrail'
    expected: 'Source-dependent MCP rules use McpSourceAuditScope rather than validator projectRoot.'
    artifacts: 'McpSourceAuditScope,source/ui/business rules'
    failureMeaning: 'A future rule can accidentally validate an external package against ATF_name sources.'
    repairHint: 'Resolve source files through context.sourceAuditScope().sourceRoot() and gate definitive blockers with canProveSourcePresence().'
  - id: 'package.accounting.runtime-window'
    expected: 'Package accounting matches ROUND_TARGET_TEST_COUNT and META_ITERATION_COUNT.'
    artifacts: 'review/package-state.json,review/quality-accounting-verdict.md'
    failureMeaning: 'The package may count runs/tests that do not belong to the governed window.'
    repairHint: 'Recalculate package accounting from runtime counters and saved run artifacts.'
  - id: 'package.artifact-spine.exists'
    expected: 'Package-level artifacts exist and are not empty.'
    artifacts: 'review/package-state.json,review/root-source-thin-no-index.diff'
    failureMeaning: 'The package has no cold spine for a future agent to reopen.'
    repairHint: 'Restore package-state, root diff, gate, close-out and required review artifacts.'
  - id: 'published-artifacts.no-template-noise'
    expected: 'Published artifacts contain no unresolved template placeholders.'
    artifacts: 'README.md,review/*.md,analysis/*.html'
    failureMeaning: 'The package leaks scaffold text instead of finished audit evidence.'
    repairHint: 'Replace template placeholders with package-specific truth.'
  - id: 'readme.package-state.sync'
    expected: 'README and package-state publish the same package truth.'
    artifacts: 'README.md,review/package-state.json'
    failureMeaning: 'Human memory and machine state diverge.'
    repairHint: 'Update README from package-state after final report/state edits.'
  - id: 'report-state.same-truth'
    expected: 'Report and state artifacts agree on package verdict, score and business object.'
    artifacts: 'analysis/langgraph-business-understanding.html,review/package-state.json'
    failureMeaning: 'The public report is stale or inflated relative to state.'
    repairHint: 'Regenerate the report or package-state, then rerun MCP.'
