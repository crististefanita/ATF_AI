schemaVersion: 1
contracts:
  - id: root_diff_files_count
    profile: package-closeout
    category: source
    severity: BLOCKER
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count distinct src/** paths in review/root-source-thin-no-index.diff
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-formula-trace.md
      route: source-evolution-closeout
    why: Proves the final package has a real source delta, not only regenerated artifacts.
    qualityMeaning: Zero or mismatched values mean the final story is not reopenable from diff evidence.
    agentAction: rerun package close-out after regenerating the root diff and ledger
    repairHint: Recalculate from diff evidence and update source-evolution-ledger.md plus final report summary.
    repairCommand: mvn -q -Dsurefire.suiteXmlFiles=src/test/resources/skills/mcp/testng-mcp-package-closeout.xml test
    capImpact: 95+ blocked until this KPI matches source evidence
    publishabilityImpact: package close-out cannot be trusted when declared KPI differs from diff evidence
    validator: com.ai.skills.mcp.rules.source.kpi.SourceEvolutionKpiConsistencyRule
  - id: src_main_files
    profile: package-closeout
    category: source
    severity: BLOCKER
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count distinct src/main/** paths in review/root-source-thin-no-index.diff
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-formula-trace.md
      route: source-evolution-closeout
    why: Shows whether production/support code changed versus tests only.
    qualityMeaning: A high value needs architectural justification; a hidden mismatch means source accounting is false.
    agentAction: recalculate source split and explain support/main changes
    repairHint: Recalculate from diff evidence and update source-evolution-ledger.md plus final report summary.
    repairCommand: regenerate root-source-thin-no-index.diff and source-evolution-ledger.md
    capImpact: 95+ blocked until this KPI matches source evidence
    publishabilityImpact: package close-out cannot be trusted when declared KPI differs from diff evidence
    validator: com.ai.skills.mcp.rules.source.kpi.SourceEvolutionKpiConsistencyRule
  - id: src_test_files
    profile: package-closeout
    category: test-design
    severity: BLOCKER
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count distinct src/test/** paths in review/root-source-thin-no-index.diff
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-formula-trace.md
      route: source-evolution-closeout
    why: Shows the test surface added by the agent.
    qualityMeaning: A mismatch makes test growth claims untrustworthy.
    agentAction: recalculate test split and map test files to business claims
    repairHint: Recalculate from diff evidence and update source-evolution-ledger.md plus final report summary.
    repairCommand: regenerate root-source-thin-no-index.diff and source-evolution-ledger.md
    capImpact: 95+ blocked until this KPI matches source evidence
    publishabilityImpact: package close-out cannot be trusted when declared KPI differs from diff evidence
    validator: com.ai.skills.mcp.rules.source.kpi.SourceEvolutionKpiConsistencyRule
  - id: files_added
    profile: package-closeout
    category: source
    severity: BLOCKER
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count diff blocks with new file mode or --- /dev/null
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-formula-trace.md
      route: source-evolution-closeout
    why: Separates new architecture from edits to existing code.
    qualityMeaning: Inflated added counts can hide churn; low added counts with many edits can hide risky patching.
    agentAction: recompute add/modify/delete counters from git diff headers
    repairHint: Recalculate from diff evidence and update source-evolution-ledger.md plus final report summary.
    repairCommand: recalculate file status counters from root diff
    capImpact: 95+ blocked until this KPI matches source evidence
    publishabilityImpact: package close-out cannot be trusted when declared KPI differs from diff evidence
    validator: com.ai.skills.mcp.rules.source.kpi.SourceEvolutionKpiConsistencyRule
  - id: files_modified
    profile: package-closeout
    category: source
    severity: BLOCKER
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count diff blocks that are neither added nor deleted
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-formula-trace.md
      route: source-evolution-closeout
    why: Shows how much existing code was changed.
    qualityMeaning: Large modified counts need a stronger reason than artifact cleanup.
    agentAction: recompute modified count and lower score if churn is broad
    repairHint: Recalculate from diff evidence and update source-evolution-ledger.md plus final report summary.
    repairCommand: recalculate file status counters from root diff
    capImpact: 95+ blocked until this KPI matches source evidence
    publishabilityImpact: package close-out cannot be trusted when declared KPI differs from diff evidence
    validator: com.ai.skills.mcp.rules.source.kpi.SourceEvolutionKpiConsistencyRule
  - id: files_deleted
    profile: package-closeout
    category: source
    severity: BLOCKER
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count diff blocks with deleted file mode or +++ /dev/null
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-formula-trace.md
      route: source-evolution-closeout
    why: Makes destructive source movement visible.
    qualityMeaning: Deletes require explicit provenance; undeclared deletes are close-out blockers.
    agentAction: recompute deleted count and explain removed source
    repairHint: Recalculate from diff evidence and update source-evolution-ledger.md plus final report summary.
    repairCommand: recalculate file status counters from root diff
    capImpact: 95+ blocked until this KPI matches source evidence
    publishabilityImpact: package close-out cannot be trusted when declared KPI differs from diff evidence
    validator: com.ai.skills.mcp.rules.source.kpi.SourceEvolutionKpiConsistencyRule
  - id: test_methods_added
    profile: package-closeout
    category: test-design
    severity: BLOCKER
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count added lines matching + @Test in review/root-source-thin-no-index.diff
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-formula-trace.md
      route: source-evolution-closeout
    why: Connects source delta to test value, not just file count.
    qualityMeaning: Many tests with weak business mapping should cap the score even if they pass.
    agentAction: recalculate @Test delta and map each test group to owned claims
    repairHint: Recalculate from diff evidence and update source-evolution-ledger.md plus final report summary.
    repairCommand: recalculate @Test deltas from root diff
    capImpact: 95+ blocked until this KPI matches source evidence
    publishabilityImpact: package close-out cannot be trusted when declared KPI differs from diff evidence
    validator: com.ai.skills.mcp.rules.source.kpi.SourceEvolutionKpiConsistencyRule
  - id: protected_root_dirty_count
    profile: package-closeout
    category: protected-boundary
    severity: BLOCKER
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count root-diff paths under ATF core, UI/API core, MCP, Atlas, prompt or shared CSS surfaces
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: undo protected source changes before publishing
      supportingArtifact: validation/mcp/mcp-kpi-formula-trace.md
      route: source-evolution-closeout
    why: Enforces that generated package work does not rewrite the framework or validator.
    qualityMeaning: Any protected drift blocks 95+ and usually means undo, not explanation.
    agentAction: undo protected source changes or move them to an explicit framework task
    repairHint: Recalculate from diff evidence and update source-evolution-ledger.md plus final report summary.
    repairCommand: git status --short -- protected roots; undo framework/MCP/Atlas changes
    capImpact: 95+ blocked until this KPI matches source evidence
    publishabilityImpact: package close-out cannot be trusted when declared KPI differs from diff evidence
    validator: com.ai.skills.mcp.rules.source.kpi.SourceEvolutionKpiConsistencyRule
  - id: test_classes_added
    profile: diagnostic
    category: test-design
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count distinct src/test/**/*.java files in root diff
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Shows whether tests are organized into reviewable classes.
    qualityMeaning: Too many tiny classes or one overloaded class both need refactoring.
    agentAction: split or merge test classes around coherent business scenarios
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: support_classes_added
    profile: diagnostic
    category: support-quality
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count distinct Java files under /support/ in root diff
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Shows whether reusable flow/support code exists.
    qualityMeaning: Support should reduce repetition, not become a parallel test suite.
    agentAction: move repeated steps into narrow support classes
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: support_cohesion_score
    profile: diagnostic
    category: support-quality
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: round(test methods using support * 100 / max(1, support classes touched)) capped at 100
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Measures whether support code is actually used by tests.
    qualityMeaning: Low cohesion means helpers were added cosmetically or are too fragmented.
    agentAction: delete dead helpers or consolidate them behind business-facing flows
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: test_duplication_signal
    profile: diagnostic
    category: test-design
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: legacy alias for duplicate_action_line_ratio
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Keeps older ledgers readable while the normalized duplicate ratios take over.
    qualityMeaning: Use duplicate_action_line_ratio and duplicate_assertion_line_ratio for decisions.
    agentAction: extract repeated steps into support or validation helpers
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: duplicate_action_line_ratio
    profile: diagnostic
    category: test-design
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: round(repeated added action lines * 100 / added action lines)
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Normalizes copy/paste signal so large diffs do not look worse only because they are large.
    qualityMeaning: High ratio means repeated test steps should move into support flows before scoring high.
    agentAction: extract repeated action lines into reusable support/page/service helpers
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: duplicate_assertion_line_ratio
    profile: diagnostic
    category: test-design
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: round(repeated added assertion lines * 100 / added assertion lines)
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Separates repeated verification debt from general action duplication.
    qualityMeaning: High ratio means validations are scattered and should be consolidated.
    agentAction: move repeated assertions into validation/support helpers
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: page_component_classes_touched
    profile: diagnostic
    category: support-quality
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count Java files whose path indicates page/component layer
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Identifies whether UI structure is layered instead of test-only scripts.
    qualityMeaning: Useful when paired with low direct engine leakage.
    agentAction: keep page/component abstractions thin and business-neutral
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: direct_ui_engine_leakage_count
    profile: diagnostic
    category: protected-boundary
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count added lines mentioning Playwright, WebDriver or Selenium
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Detects tests bypassing framework/support abstractions.
    qualityMeaning: High leakage means tests are coupled to engine details.
    agentAction: move engine calls behind UI support/page/component layers
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: layering_violation_count
    profile: diagnostic
    category: protected-boundary
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: count added test lines that call low-level UI/API engines directly
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Separates acceptable support implementation from test-layer leakage.
    qualityMeaning: Non-zero in tests means the agent should reorganize classes before close-out.
    agentAction: move direct engine usage out of test classes
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: assertion_locality_score
    profile: diagnostic
    category: test-design
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: 100 when added assertions stay outside test classes or are absent; otherwise decreases by scattered assertions
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Encourages validations to live in support/validation APIs, not scattered scripts.
    qualityMeaning: Low score means tests are harder to read and maintain.
    agentAction: move repeated assertions into validation/support helpers
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: business_claims_owned
    profile: diagnostic
    category: report-proof
    severity: INFO
    sourceArtifact: analysis/langgraph-business-understanding.html
    formula: count final-report rows that mention owned business claims
    repair:
      observedArtifact: analysis/langgraph-business-understanding.html
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Measures whether tests defend named business claims.
    qualityMeaning: Low value means the package may be technically green but weak as evidence.
    agentAction: rewrite proof mapping around real business objects and claims
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: business_object_ownership_count
    profile: diagnostic
    category: report-proof
    severity: INFO
    sourceArtifact: analysis/langgraph-business-understanding.html
    formula: count final-report rows mentioning owned business objects/claims
    repair:
      observedArtifact: analysis/langgraph-business-understanding.html
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Checks that ownership is about domain objects, not generic screens.
    qualityMeaning: Low value means the report may describe UI motion instead of business value.
    agentAction: name the protected business object in proof mapping
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: diff_efficiency
    profile: diagnostic
    category: score-honesty
    severity: INFO
    sourceArtifact: review/source-evolution-ledger.md
    formula: round(business_claims_owned * 100 / root_diff_files_count)
    repair:
      observedArtifact: review/source-evolution-ledger.md
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Shows business proof per file touched.
    qualityMeaning: Low efficiency suggests broad churn for little business evidence.
    agentAction: reduce source churn or lower score/cap
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: test_value_density
    profile: diagnostic
    category: score-honesty
    severity: INFO
    sourceArtifact: review/source-evolution-ledger.md
    formula: round(business_claims_owned * 100 / test_methods_added)
    repair:
      observedArtifact: review/source-evolution-ledger.md
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Shows claim value per test method.
    qualityMeaning: Low density means many tests may be variants, not new coverage.
    agentAction: merge cosmetic variants and keep distinct business assertions
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: support_reuse_ratio
    profile: diagnostic
    category: support-quality
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: round(test_methods_using_support * 100 / test_methods_added)
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Shows whether tests reuse generated support instead of duplicating flows.
    qualityMeaning: Low reuse means support architecture is not carrying the suite.
    agentAction: refactor tests to use support flows consistently
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
