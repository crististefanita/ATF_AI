  - id: refactor_burn_down
    profile: diagnostic
    category: support-quality
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: round(support classes * 100 / max(1, support classes + test classes))
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Approximates whether repeated behavior moved toward support.
    qualityMeaning: Very low values suggest test-only growth; very high values need dead-helper audit.
    agentAction: balance support extraction with test readability
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: protected_root_purity
    profile: diagnostic
    category: protected-boundary
    severity: INFO
    sourceArtifact: review/root-source-thin-no-index.diff
    formula: 100 when protected_root_dirty_count is zero, otherwise 0
    repair:
      observedArtifact: review/root-source-thin-no-index.diff
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Gives an easy score signal for framework-boundary purity.
    qualityMeaning: Anything below 100 means the agent touched protected framework territory.
    agentAction: undo protected changes before asking for 95+
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: run_delta_uniqueness
    profile: diagnostic
    category: source
    severity: INFO
    sourceArtifact: review/source-evolution-ledger.md
    formula: round(distinct non-empty run source deltas * 100 / run diffs)
    repair:
      observedArtifact: review/source-evolution-ledger.md
      primaryArtifact: review/source-evolution-ledger.md
      supportingArtifact: validation/mcp/mcp-kpi-matrix.md
      route: source-evolution-diagnostic
    why: Shows whether runs learned new things or repeated the same delta.
    qualityMeaning: Low uniqueness means reruns were used as noise, not progress.
    agentAction: collapse duplicate runs or explain why repeated deltas were retained
    repairHint: Use this diagnostic KPI to calibrate quality and score caps; do not force artifact surgery.
    repairCommand: rerun MCP close-out to regenerate validation/mcp/mcp-kpi-matrix.*
    capImpact: diagnostic only until calibrated across representative ATF_name packages
    publishabilityImpact: does not block publishability alone, but should influence score/cap honesty
    metadataOnly: true
  - id: run_learning_yield
    profile: diagnostic
    category: source
