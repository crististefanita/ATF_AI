schemaVersion: 1
contracts:
  - id: code-quality.package-class-default
    kind: direct-package-class-limit
    max: 8
    owner: Code Quality skill
    repair: Split packages by responsibility before adding a ninth direct Java class.

  - id: code-quality.legacy-ratchet-stale-slack
    kind: stale-ratchet-slack
    slack: 2
    owner: Code Quality skill
    repair: Lower legacy caps when actual package/class size is at least two below the cap.

  - id: code-quality.legacy-yaml-ratchet-stale-slack
    kind: stale-yaml-ratchet-slack
    slackBytes: 1024
    owner: Code Quality skill
    repair: Lower legacy YAML caps when actual resource size is at least one kilobyte below the cap.

  - id: code-quality.class-size-default
    kind: class-size-default
    warningLines: 220
    maxLines: 320
    maxWarningFiles: 75
    maxOverMaxFiles: 23
    owner: Code Quality skill
    repair: Split large classes before adding new behavior; files above maxLines require a legacy class-size cap.

  - id: code-quality.method-size-default
    kind: method-size-default
    warningLines: 60
    maxLines: 100
    maxWarningMethods: 12
    maxOverMaxMethods: 0
    owner: Code Quality skill
    repair: Split long methods into named helpers before adding more branching or fixture setup.

  - id: code-quality.assertion-density-default
    kind: assertion-density-default
    minimumCuePercent: 50
    maxLowDensityClasses: 0
    maxZeroCueClasses: 0
    owner: Code Quality skill
    repair: Test classes must expose executable assertion cues through Assert, assert*, require* or fail helpers.

  - id: code-quality.yaml-size-default
    kind: yaml-size-default
    warningBytes: 10000
    maxBytes: 20000
    maxWarningFiles: 17
    maxOverMaxFiles: 8
    owner: Code Quality skill
    repair: Split YAML contracts by ownership before growing large resource files.

  - id: code-quality.suite-count-default
    kind: suite-count-default
    maxSuites: 40
    owner: Code Quality skill
    repair: Split or retire TestNG suites deliberately before adding more suite entry points; the current cap includes the Core smoke preflight suite.

  - id: code-quality.java-compatibility.no-stream-to-list
    kind: java-compatibility-ban
    forbiddenApi: stream.toList
    owner: Code Quality skill
    repair: Use collect(Collectors.toList()) until the project baseline explicitly supports Stream.toList().

  - id: code-quality.source-main
    kind: source-root
    path: src/main/java
    owner: Code Quality skill
    repair: Main Java source packages must stay readable and cohesive.

  - id: code-quality.source-test
    kind: source-root
    path: src/test/java
    owner: Code Quality skill
    repair: Test source packages must stay readable and split by contract family.

  - id: code-quality.resource-main
    kind: resource-root
    path: src/main/resources
    owner: Code Quality skill
    repair: Main resources must stay bounded and owned by skill or core contract surface.

  - id: code-quality.resource-test
    kind: resource-root
    path: src/test/resources
    owner: Code Quality skill
    repair: Test resources and TestNG suites must stay bounded and profile-driven.

  - id: code-quality.boundary.core-main-no-mcp
    kind: dependency-boundary
    root: src/main/java/com/endava/ai/core
    forbiddenPackage: com.endava.ai.skills.mcp
    owner: Code Quality dependency boundary
    repair: Keep Core generic; expose shared contracts through core/support or core/skills only, not MCP imports.

  - id: code-quality.boundary.core-main-no-atlas
    kind: dependency-boundary
