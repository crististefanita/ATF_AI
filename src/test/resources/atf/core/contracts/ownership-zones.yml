schemaVersion: 1
contracts:
  - id: "profile-taxonomy"
    capabilityId: "core.profile.taxonomy"
    owner: "AtfContractProfile + TestNG profile XML"
    sourceRoot: "src/test/resources/atf/core"
    input: "New execution family or profile split"
    output: "Canonical fast, visual, aggregate, Extent, Allure, API and UI support profiles"
    contractTest: "com.ai.atf.core.support.profiles.AtfCoreTestNgProfileContractTest"
    suiteXml: "src/test/resources/atf/core/suites/core/testng-atf-core-fast.xml"
    repairTarget: "src/test/resources/atf/core/suites/core/testng-atf-core-fast.xml"
    responsibility: "Change profile metadata and suite XML together; do not bury slow or visual checks in the fast lane."
  - id: "capability-catalog"
    capabilityId: "core.contract.inventory"
    owner: "AtfCapabilityCatalog + AtfCapabilitySpec"
    sourceRoot: "src/main/java/com/ai/core/support/contract/capability"
    input: "Framework capability added, renamed or split"
    output: "Readable capability row with profile, severity, evidence, report expectation and repair hint"
    contractTest: "com.ai.atf.core.support.contract.capability.AtfCapabilityCatalogContractTest"
    suiteXml: "src/test/resources/atf/core/suites/core/testng-atf-core-fast.xml"
    repairTarget: "src/test/resources/atf/core/contracts/capabilities.yml"
    responsibility: "Add a YAML capability row before treating a new contract family as owned by ATF core."
  - id: "mcp-boundary"
    capabilityId: "core.contract.inventory"
    owner: "core/ui.core/api.core boundary from MCP package-audit policy"
    sourceRoot: "src/main/java/com/ai"
    input: "Core runtime code is edited while MCP rules evolve"
    output: "No MCP imports or package-audit vocabulary leak into reusable ATF core surfaces"
    contractTest: "com.ai.atf.core.support.architecture.CoreMcpBoundaryContractTest"
    suiteXml: "src/test/resources/atf/core/suites/core/testng-atf-core-fast.xml"
    repairTarget: "src/main/java/com/ai/core"
    responsibility: "Move package-audit vocabulary back to com.ai.skills.mcp; core remains generic runtime infrastructure."
  - id: "lifecycle"
    capabilityId: "reporting.lifecycle.listener"
    owner: "TestListener + ReportingManager + ReportingSession"
    sourceRoot: "src/main/java/com/ai/core/reporting/listener"
    input: "TestNG suite/test lifecycle callbacks"
    output: "ReportingSession state transitions and listener-owned lifecycle evidence"
    contractTest: "com.ai.atf.core.reporting.architecture.TestListenerArchitectureContractTest"
    suiteXml: "src/test/resources/atf/core/suites/core/testng-atf-core-fast.xml"
    repairTarget: "src/main/java/com/ai/core/reporting/listener"
    responsibility: "Keep TestListener an orchestrator over lifecycle collaborators, not a reporting implementation sink."
  - id: "step-console"
    capabilityId: "reporting.lifecycle.listener"
    owner: "StepLogger + ConsoleLogger"
    sourceRoot: "src/main/java/com/ai/core/reporting"
    input: "Framework step events and human-readable runtime narration"
    output: "Console-safe step output and delegated report nodes"
    contractTest: "com.ai.atf.core.reporting.regression.StepLoggerContractTest"
    suiteXml: "src/test/resources/atf/core/suites/core/testng-atf-core-fast.xml"
    repairTarget: "src/main/java/com/ai/core/reporting/step"
    responsibility: "Keep static facades thin; route mutable state through resettable delegates and ConsoleLogger."
  - id: "thread-local-lifecycle"
    capabilityId: "reporting.lifecycle.listener"
    owner: "ThreadLocal owners in reporting/listener runtime"
    sourceRoot: "src/main/java/com/ai/core"
    input: "Per-thread test/report state"
    output: "Explicit owner catalog and cleanup path for every ThreadLocal"
    contractTest: "com.ai.atf.core.reporting.architecture.ConsoleAndThreadLocalArchitectureContractTest"
    suiteXml: "src/test/resources/atf/core/suites/core/testng-atf-core-fast.xml"
    repairTarget: "src/main/java/com/ai/core/reporting/listener/internal/lifecycle"
    responsibility: "Add no ThreadLocal without owner, cleanup method and architecture contract review."
  - id: "runtime-audit"
    capabilityId: "reporting.extent.spark.presentation"
    owner: "ExtentRuntimeAuditPublisher + runtime value objects"
    sourceRoot: "src/main/java/com/ai/core/reporting/listener/internal/runtime"
    input: "Observed runtime invocation records"
    output: "Typed audit summaries, timelines, tag audit and failure group sections"
    contractTest: "com.ai.atf.core.reporting.adapters.spark.ExtentSparkRuntimeAuditContractTest"
    suiteXml: "src/test/resources/atf/core/suites/reporting/testng-atf-extent.xml"
    repairTarget: "src/main/java/com/ai/core/reporting/listener/internal/runtime"
    responsibility: "Convert observed invocations into typed models before rendering HTML."
  - id: "extent-patch-pipeline"
    capabilityId: "reporting.extent.spark.presentation"
    owner: "ExtentSparkHtmlPostProcessor + patch planners/applier"
    sourceRoot: "src/main/java/com/ai/core/reporting/adapters/extent"
    input: "Flushed Extent Spark HTML"
    output: "Deterministically normalized Extent HTML with ATF runtime sections preserved"
    contractTest: "com.ai.atf.core.reporting.adapters.ExtentHtmlPatchPipelineContractTest"
    suiteXml: "src/test/resources/atf/core/suites/reporting/testng-atf-extent.xml"
    repairTarget: "src/main/java/com/ai/core/reporting/adapters/extent"
    responsibility: "Keep planners pure and leave mutation/IO to the applier/finalizer boundary."
  - id: "extent-visual-shell"
    capabilityId: "reporting.extent.spark.presentation"
    owner: "ExtentSparkTheme + Spark sections/tokens"
    sourceRoot: "src/main/java/com/ai/core/reporting/adapters/extent/spark"
    input: "ATF semantic visual tokens and Extent shell fragments"
    output: "Spark-compatible CSS/JS sections with collapsed readable test evidence"
    contractTest: "com.ai.atf.core.reporting.adapters.spark.ExtentSparkShellStyleContractTest"
    suiteXml: "src/test/resources/atf/core/suites/reporting/testng-atf-extent.xml"
    repairTarget: "src/main/java/com/ai/core/reporting/adapters/extent/spark/sections"
    responsibility: "Move visual behavior into tokens/section packages before increasing root composers."
  - id: "screenshot-evidence"
    capabilityId: "reporting.screenshot.evidence"
    owner: "FinalStateAttachmentRegistry + FailureAttachmentRegistry + UI screenshot handlers"
    sourceRoot: "src/main/java/com/ai/core/reporting/attachment"
    input: "UI final-state and failure screenshot capture requests"
    output: "Single-policy screenshot attachments without duplicate evidence"
    contractTest: "com.ai.atf.core.reporting.screenshot.FinalUiScreenshotContractTest"
    suiteXml: "src/test/resources/atf/core/suites/core/testng-atf-core-visual.xml"
    repairTarget: "src/main/java/com/ai/core/reporting/attachment"
    responsibility: "Centralize screenshot policy in registries; do not duplicate attachment decisions in listener or engines."
  - id: "api-core"
    capabilityId: "api.base.lifecycle"
    owner: "BaseTestAPI + api.core client/validation"
    sourceRoot: "src/main/java/com/ai/api/core"
    input: "Generic HTTP/API runtime, auth readiness and validation helpers"
    output: "API-only lifecycle, retries, validation models and response assertions without UI engine startup"
    contractTest: "com.ai.atf.core.support.base.BaseTestAPIContractTest"
    suiteXml: "src/test/resources/atf/core/suites/core/testng-atf-core-fast.xml"
    repairTarget: "src/main/java/com/ai/api/core"
    responsibility: "Keep generic API framework code under api.core; domain services/models belong in api.support."
  - id: "ui-engine"
    capabilityId: "ui.engine.parity"
    owner: "UIEngine + engine registry/providers"
    sourceRoot: "src/main/java/com/ai/ui/core/engine"
    input: "Selenium/Playwright adapter behavior and capability differences"
    output: "Common UI action surface with explicit capability metadata"
    contractTest: "com.ai.atf.ui.component.UiEngineCapabilityContractTest"
    suiteXml: "src/test/resources/atf/core/suites/ui/testng-atf-ui-engine.xml"
    repairTarget: "src/main/java/com/ai/ui/core/engine"
    responsibility: "Add engine behavior through providers/action collaborators, not through tests or reporting hooks."
  - id: "ui-wait-policy"
    capabilityId: "ui.wait.policy"
    owner: "UiSleeper + wait policy contracts"
    sourceRoot: "src/main/java/com/ai/ui/core/wait"
    input: "Fixed UI pauses and interrupt handling"
    output: "One fixed-sleep policy with interrupt preservation"
    contractTest: "com.ai.atf.ui.component.WaitUtilsContractTest"
    suiteXml: "src/test/resources/atf/core/suites/ui/testng-atf-ui-engine.xml"
    repairTarget: "src/main/java/com/ai/ui/core/wait"
    responsibility: "Use UiSleeper for fixed pauses; conditional waits stay in engine-specific wait abstractions."
  - id: "aggregate-report"
    capabilityId: "reporting.extent.aggregate"
    owner: "AtfCoreAggregateReportListener + main aggregate runtime writers"
    sourceRoot: "src/main/java/com/ai/core/reporting/aggregate"
    input: "Nested ATF core contract execution results"
    output: "Aggregate Extent report artifact for ATF core sweeps"
    contractTest: "com.ai.atf.core.reporting.aggregate.AtfCoreAggregateExtentContractTest"
    suiteXml: "src/test/resources/atf/core/suites/aggregate/testng-atf-core-aggregate.xml"
    repairTarget: "src/main/java/com/ai/core/reporting/aggregate"
    responsibility: "Keep reusable aggregate artifact writers in main; keep TestNG listener wiring and fixtures in test."
