schemaVersion: 1
contracts:
  - id: core.contract-narrative.extent-report-mode-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Extent report mode normalization
    purpose: Classify Extent reports as runtime-audited or component/adapter without requiring browser execution.
    reportHint: Run this fast post-processor contract before visual Extent browser suites.
  - id: core.contract-narrative.extent-report-mode-contract
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentSparkHtmlPostProcessor
    expected: Every normalized Extent report publishes a machine-readable mode marker; non-runtime reports still receive a clean ATF component Overview.
    observed: The test feeds runtime and component Spark HTML snippets through the post-processor.
    repairHint: Keep report-mode detection idempotent and keep component/adapter Overview cleanup separate from runtime audit rendering.
  - id: core.contract-narrative.extent-html-patch-pipeline-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Extent HTML patch pipeline
    purpose: Keep Extent HTML normalization expressed as typed patch results instead of hidden string mutation.
    reportHint: Repair ExtentHtmlPatchResult/planners before adding new Extent report-mode or Overview branches.
  - id: core.contract-narrative.extent-html-patch-pipeline-contract
    kind: contract
    area: REPORTING_ADAPTER
    owner: Extent HTML patch pipeline
    expected: Extent normalization reports which patches applied and keeps report-mode and Overview tokens behind semantic owners.
    observed: The tests inspect patch records and verify normalized output through semantic constants.
    repairHint: Route new report changes through planners and semantic token owners, not private postprocessor literals.
  - id: core.contract-narrative.extent-status-dropdown-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Extent Spark status dropdown contract
    purpose: Protect status filtering as test-case navigation, not nested-step filtering.
    reportHint: Run this suite only in the Extent profile; it validates browser-visible status filter behavior.
  - id: core.contract-narrative.extent-status-dropdown-contract
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentSparkCollapsePolicy + runtime audit status menu
    expected: Status filters isolate pass/fail/skipped test cases and clear back to the full hierarchy.
    observed: The suite opens generated Extent HTML in Chromium and exercises the status dropdown.
    repairHint: Repair status menu normalization or test-case filtering before changing Extent navigation.
  - id: core.contract-narrative.extent-failure-triage-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Extent Spark failure triage contract
    purpose: Protect the failed-runtime Category tab as a readable failure grouping and repair surface.
    reportHint: Run this suite only in the Extent profile; it validates failure grouping, root cause detail, and green empty state.
  - id: core.contract-narrative.extent-failure-triage-contract
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentRuntimeDashboardRenderer + runtime failure grouping
    expected: Failed test cases are grouped by class/root cause and green runs show an explicit empty state.
    observed: The suite generates Extent reports, inspects the Category view, and reconciles failure counts with the runtime ledger.
    repairHint: Repair runtime failure grouping before changing dashboard or category rendering.
  - id: core.contract-narrative.base-api-runtime-suite
    kind: suite
    profile: API_BASE_CONTRACT
    area: API_LIFECYCLE
    capability: Base API runtime contract
    purpose: Validate API base-class readiness, token gating, and listener wiring.
    reportHint: Repair BaseTestAPI setup, token handling, or API listener wiring.
  - id: core.contract-narrative.base-api-runtime-class
    kind: contract
    area: API_LIFECYCLE
    owner: BaseTestAPI
    expected: BaseTestAPI initializes API runtime once and blocks write-oriented API flows when auth.token is absent.
    observed: The contract inspects listener and lifecycle annotations and exercises token readiness behavior through a test subclass.
    repairHint: Keep API setup deterministic and keep auth-token absence as a skip, not as a hidden failed write.
  - id: core.contract-narrative.base-api-listener-setup
    kind: contract
    area: API_LIFECYCLE
    owner: BaseTestAPI listener and setup contract
    expected: BaseTestAPI registers the Core TestListener facade and keeps API runtime setup in @BeforeClass(alwaysRun=true). Allure is discovered through its native TestNG service when atf-reporting is present.
    observed: The test verifies @Listeners(TestListener.class) and baseSetup() lifecycle metadata without a direct Allure annotation in Core.
    repairHint: Keep the Core TestListener annotation and class-level baseSetup lifecycle; provide report implementations through atf-reporting.
  - id: core.contract-narrative.base-api-auth-readiness
    kind: contract
    area: API_LIFECYCLE
    owner: BaseTestAPI auth readiness contract
    expected: Missing auth.token produces a deliberate SkipException for write-oriented API tests; present token allows execution to continue.
    observed: The test calls requireTokenForWrites() through a subclass with blank and non-blank tokens.
    repairHint: Keep auth readiness explicit so API contract tests do not perform unauthenticated writes by accident.
  - id: core.contract-narrative.base-api-no-ui-runtime
    kind: contract
    area: API_LIFECYCLE
    owner: API core source boundary
    expected: API core and ATF API lifecycle tests must not initialize or reference UI engine runtime.
    observed: The test scans API main/test sources for UI runtime markers such as UIEngine, DriverManager, BaseTestUI, ui.engine, and ui.headless.
    repairHint: Move UI runtime concerns to UI support tests; API lifecycle contracts must stay HTTP/API-only.
  - id: core.contract-narrative.base-api-package-architecture
    kind: contract
    area: API_LIFECYCLE
    owner: API package architecture
    expected: Generic API runtime code lives under com.ai.api.core in atf-core; application API support lives under com.ai.api.support in atf-tests test sources.
    observed: The test verifies the API runtime roots in atf-core and application support roots in atf-tests, and rejects legacy or generic packages under api.support.
    repairHint: Keep BaseTestAPI, HTTP clients, generic validators and utilities in atf-core; keep domain steps, services, models and factories in atf-tests test sources.
  - id: core.contract-narrative.base-api-console-hygiene
    kind: contract
    area: API_LIFECYCLE
    owner: API core console hygiene
    expected: API core routes diagnostic output through reporting helpers instead of writing directly to System.out.
    observed: The test scans api.core sources for direct System.out usage.
    repairHint: Use StepLogger or ConsoleLogger from framework reporting utilities instead of System.out in API core.
  - id: core.contract-narrative.base-api-wait-centralization
    kind: contract
    area: API_LIFECYCLE
    owner: API core wait hygiene
    expected: API core centralizes Thread.sleep and interrupt handling in ApiSleeper.
    observed: The test scans api.core sources for direct Thread.sleep usage outside ApiSleeper.
    repairHint: Route API waits through ApiSleeper so interrupt handling stays explicit and consistent.
  - id: core.contract-narrative.base-api-wait-interrupt-policy
    kind: contract
    area: API_LIFECYCLE
    owner: API core wait interrupt policy
    expected: ApiSleeper rejects invalid durations and preserves interrupted status when a wait is interrupted.
    observed: The test exercises the centralized API wait helper directly.
    repairHint: Keep ApiSleeper as the single place for API wait validation and interrupt propagation.
  - id: core.contract-narrative.base-api-validation-model-boundary
    kind: contract
    area: API_LIFECYCLE
    owner: API core validation model boundary
    expected: Generic API validation DTOs must live physically and logically under api.core.validation.model, not api.support.model.
    observed: The test checks source package declarations, runtime class package names, and ResponseValidator imports.
    repairHint: Keep generic error/validation response DTOs under api.core.validation.model; keep product/domain DTOs under api.support.model.
  - id: core.contract-narrative.reporting-package-shape-suite
    kind: suite
    profile: REPORTING_CONTRACT
    area: REPORTING_ADAPTER
    capability: ATF reporting package shape contract
    purpose: Keep new reporting packages small and keep legacy Extent/reporting debt under explicit ratchet caps.
    reportHint: Split reporting packages by adapter or presentation responsibility before adding more contract classes.
  - id: core.contract-narrative.reporting-package-shape-class
    kind: contract
    area: REPORTING_ADAPTER
    owner: ATF reporting package architecture
    expected: New reporting packages contain at most ten direct Java classes; catalogued legacy packages cannot grow.
    observed: The test scans main reporting code and ATF reporting contract tests by direct package with legacy caps.
    repairHint: Create a focused subpackage when a reporting family reaches the readability threshold; shrink catalogued caps after each split.
  - id: core.contract-narrative.extent-adapter-suite
    kind: suite
    profile: EXTENT_CONTRACT
    area: REPORTING_ADAPTER
    capability: Reporting adapter contract
    purpose: Validate Extent/Allure adapter behavior and artifact hygiene.
    reportHint: Repair adapter output, cleanup, or attachment serialization.
  - id: core.contract-narrative.extent-adapter-class
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentAdapter
    expected: Extent writes one reopenable HTML report, escapes HTML-like step text, and does not require local spark assets.
    observed: Adapter self-tests generate isolated Extent fixture output and inspect the produced HTML.
    repairHint: Check ExtentAdapter escaping and ExtentReporter single-file configuration.
  - id: core.contract-narrative.extent-adapter-component-overview
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentAdapter + ExtentSparkHtmlPostProcessor
    expected: Every ExtentAdapter flush writes a standardized Spark report with report-mode marker, ATF component tag tables, and no raw Spark Overview cards.
    observed: The test generates a small component/adapter Extent report through ExtentAdapter.flush and inspects the persisted HTML.
    repairHint: Keep ExtentReportSession.flushAndStandardize wired to ExtentSparkHtmlPostProcessor; do not let raw Spark Overview HTML escape to target/reports.
  - id: core.contract-narrative.extent-adapter-default-report-dir
    kind: contract
    area: REPORTING_ADAPTER
    owner: framework.properties
    expected: The default Extent HTML artifact is generated under target/reports, not under the Allure artifact folder.
    observed: The test reads atf-core/src/main/resources/framework.properties and checks the canonical reports.dir value.
    repairHint: Keep reports.dir=target/reports for Extent. Allure results belong under the dedicated Allure result directory.
  - id: core.contract-narrative.extent-adapter-fixture-sandbox
    kind: contract
    area: REPORTING_ADAPTER
    owner: Extent adapter contract fixtures
    expected: Adapter self-tests use an isolated contract report directory and do not create extra final-run reports.
    observed: The test checks the active fixture reports.dir sandbox used by ExtentAdapterTest.
    repairHint: Keep adapter fixture reports in a temporary sandbox, not target/reports or target/contract-reports.
  - id: core.contract-narrative.extent-adapter-stable-artifact
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportSettings
    expected: When timestamped reports are disabled, Extent resolves a stable ExtentReport.html artifact in the configured reports directory.
    observed: The test builds ExtentReportSettings from explicit values and inspects the resolved report path.
    repairHint: Keep timestamp naming inside ExtentReportSettings so report paths stay auditable and testable.
  - id: core.contract-narrative.extent-adapter-timestamped-artifact
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportSettings
    expected: When timestamped reports are enabled, Extent resolves an ExtentReport_<timestamp>.html artifact using the configured format.
    observed: The test builds ExtentReportSettings with a deterministic timestamp and checks the generated file name.
    repairHint: Do not duplicate timestamp file-name logic in ExtentReporter or tests; keep it in ExtentReportSettings.
  - id: core.contract-narrative.extent-adapter-explicit-file-name
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportSettings
    expected: Maven can declare an explicit Extent HTML file name for published validation artifacts without post-processing the generated report.
    observed: The test configures reports.file.name and verifies Extent resolves that exact file inside reports.dir.
    repairHint: Keep published Extent artifact names configurable through ExtentReportSettings, not through copy/rename scripts.
  - id: core.contract-narrative.extent-adapter-file-names-helper
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportFiles
    expected: Stable and timestamped Extent report names are identified by one reusable contract object.
    observed: The test verifies the shared filename factory and matcher used by runtime locators and tests.
    repairHint: Do not duplicate ExtentReport.html / ExtentReport_<timestamp>.html checks in listener or test code.
  - id: core.contract-narrative.extent-adapter-runtime-settings
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportSettings
    expected: ExtentReporter consumes one runtime settings object instead of recomputing report path, title, and report name inline.
    observed: The test loads ExtentReportSettings from the sandboxed runtime config used by this Extent contract suite.
    repairHint: Route Extent report creation through ExtentReportSettings.fromRuntime().
  - id: core.contract-narrative.extent-adapter-run-scoped-timestamp
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentReportSettings + ExtentAdapter
    expected: A single TestNG run writes one timestamped Extent artifact even when the Extent adapter is re-created inside the same runtime.
    observed: The test enables timestamped reports, writes through two adapter lifecycles, and counts generated Extent HTML files.
    repairHint: Keep timestamped Extent report paths run-scoped; do not recompute a fresh timestamp for every ExtentReporter instance.
  - id: core.contract-narrative.extent-adapter-spark-reporter-settings
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentSparkReporterSettings
    expected: Spark reporter configuration is passed as one settings object so factory wiring stays readable and extensible.
    observed: The test maps ExtentReportSettings into ExtentSparkReporterSettings and verifies path/title/name are preserved.
    repairHint: Keep Spark reporter factory input object-based; do not reintroduce parallel path/title/name parameters in ExtentReporter.
  - id: core.contract-narrative.extent-published-overview-inspector-suite
    kind: suite
    profile: REPORTING_CONTRACT
    area: REPORTING_LIFECYCLE
    capability: Published Extent Overview inspection contract
    purpose: Keep every copied/published Extent report on the agreed ATF Overview shell instead of leaking native Spark drift.
    reportHint: Run this contract when changing Extent Overview score-cards, runtime tag tables, publish policy, or published report copying.
  - id: core.contract-narrative.extent-published-overview-inspector-class
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: ExtentPublishedOverviewInspector
    expected: Published Extent validation artifacts use the standard ATF Overview vocabulary, runtime audit tables, and no blank/native Spark score-cards.
    observed: The test feeds normalized Spark HTML through the inspector under internal-fixture and published-validation policies.
    repairHint: Fix Extent post-processing or publish policy before copying a generated report into a published artifact directory.
  - id: core.contract-narrative.extent-published-overview-inspector-rejects-native-drift
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: ExtentPublishedOverviewInspector
    expected: Published validation rejects Test classes score-cards, configuration-method vocabulary, blank score-cards, and native mixed Tags cards.
    observed: The test builds a deliberately unstandardized Overview fragment and expects targeted violations.
    repairHint: Normalize dashboard labels and replace native Spark tag summary with ATF runtime tag tables.
  - id: core.contract-narrative.extent-published-overview-inspector-component-policy
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: ExtentReportPublishPolicy
    expected: Component adapter fixtures can remain internal, but the same shell is rejected when promoted as a published validation artifact.
    observed: The test compares INTERNAL_COMPONENT_FIXTURE and PUBLISHED_VALIDATION inspection results on the same normalized component HTML.
    repairHint: Do not copy component-fixture reports as final validation artifacts; regenerate through a runtime-audited suite first.
  - id: core.contract-narrative.extent-published-overview-inspector-runtime-audit
    kind: contract
    area: REPORTING_LIFECYCLE
    owner: ExtentPublishedOverviewInspector
    expected: Runtime-audited reports with classes, packages and annotations tag tables satisfy the published validation policy.
    observed: The test injects the ATF runtime tag audit block into normalized Spark HTML and expects zero publish-policy violations.
    repairHint: Ensure final Extent reports include ATF_RUNTIME_TAG_AUDIT and all required runtime tag tables before publishing.
  - id: core.contract-narrative.ui-zoom-runtime-suite
    kind: suite
    profile: UI_SUPPORT_CONTRACT
    area: WINDOW_CONFIG
    capability: UI window and zoom contract
    purpose: Validate browser window and zoom behavior that affects UI evidence quality.
    reportHint: Repair window configuration, zoom application, or screenshot evidence capture.
  - id: core.contract-narrative.ui-zoom-runtime-class
    kind: contract
    area: WINDOW_CONFIG
    owner: UIWindowSizeResolver + SeleniumEngine + PlaywrightEngine + reporting adapters
    expected: Configured page zoom is normalized, applied in Selenium and Playwright headless mode, and published as auditable report metadata.
    observed: The contract opens real Selenium and Playwright pages at configured zoom=60, expects resolved zoom=67, then inspects Extent and Allure artifacts.
    repairHint: Expose configured/resolved zoom, engine, and headless mode through StepLogger so Extent and Allure carry the runtime contract.
  - id: core.contract-narrative.ui-zoom-runtime-playwright-document
    kind: contract
    area: WINDOW_CONFIG
    owner: SeleniumEngine + PlaywrightEngine
    expected: Selenium and Playwright headless apply the resolved zoom to the loaded document, not only to screenshots by visual accident.
    observed: The test reads document.documentElement.style.zoom after UIEngine.open(...).
    repairHint: Keep the headless fallback after navigation and assert against the resolver output, not the raw configured value.
  - id: core.contract-narrative.ui-zoom-runtime-navigation-screenshot
    kind: contract
    area: WINDOW_CONFIG
    owner: SeleniumEngine + PlaywrightEngine + final screenshot capture
    expected: Selenium and Playwright headless reapply resolved zoom after app-driven navigation and before final screenshots are captured.
    observed: The test opens a zoomed source document, clicks a page-owned link, waits for the target document, then verifies zoom before and after screenshot capture.
    repairHint: Reapply the headless zoom fallback after page-owned navigation boundaries and immediately before screenshot capture.
  - id: core.contract-narrative.ui-zoom-runtime-extent-metadata
    kind: contract
    area: REPORTING_ADAPTER
    owner: ExtentAdapter + UI runtime metadata
    expected: Extent reports expose configured zoom, resolved zoom, UI engine, and headless mode as searchable runtime evidence.
    observed: The test generates local Extent reports for zoomed Selenium and Playwright headless flows and searches the produced HTML.
    repairHint: Publish zoom runtime metadata through StepLogger before or during UIEngine.open(...), then flush Extent.
  - id: core.contract-narrative.ui-zoom-runtime-allure-metadata
    kind: contract
    area: REPORTING_ADAPTER
    owner: AllureAdapter + UI runtime metadata
    expected: Allure result JSON exposes configured zoom, resolved zoom, UI engine, and headless mode as searchable runtime evidence.
    observed: The test generates a local Allure result for a zoomed Playwright headless flow and searches the produced JSON payloads.
    repairHint: Publish zoom runtime metadata as StepLogger details so Allure step parameters carry the runtime contract.
  - id: core.contract-narrative.allure-presentation-suite
    kind: suite
    profile: ALLURE_CONTRACT
    area: REPORTING_ADAPTER
    capability: Allure presentation contract
    purpose: Validate that Allure remains readable when StepLogger publishes rich UI details.
    reportHint: Repair AllureAdapter detail routing if UI details leak into top-level parameters.
  - id: core.contract-narrative.allure-presentation-class
    kind: contract
    area: REPORTING_ADAPTER
    owner: AllureAdapter
    expected: Step details are nested under Allure steps, while the test-level parameter panel stays clean.
    observed: The tests generate local Allure result JSON and inspect top-level parameters, step parameters, and test name.
    repairHint: Do not publish StepLogger detail lines as test-level Allure parameters; keep them on the active step.
  - id: core.contract-narrative.allure-presentation-no-root-parameters
    kind: contract
    area: REPORTING_ADAPTER
    owner: AllureAdapter
    expected: UI details such as locator/value/text are not promoted to top-level Allure test parameters.
    observed: The generated Allure result is parsed and root.parameters is inspected.
    repairHint: Remove test-level parameter publication from AllureAdapter.logDetail(...).
  - id: core.contract-narrative.allure-presentation-clean-test-name
    kind: contract
    area: REPORTING_ADAPTER
    owner: AllureAdapter
    expected: The Allure test name remains short and readable; detailed evidence stays in collapsible steps.
    observed: The generated Allure result is parsed for name and step-level parameters.
    repairHint: Keep evidence in StepResult.parameters and attachments, not in the test list summary.
  - id: core.contract-narrative.allure-presentation-contract-steps
    kind: contract
    area: REPORTING_ADAPTER
    owner: AllureAdapter
    expected: Contract diagnostics are visible as Allure steps, not only as TestNG parameters.
    observed: The generated Allure result is parsed for Expected / Observed / Cold verdict step nodes.
    repairHint: Route contract diagnostics through StepLogger.startStep/logDetail/pass so Allure users can inspect them in Execution.
  - id: core.contract-narrative.allure-presentation-buffered-steps
    kind: contract
    area: REPORTING_ADAPTER
    owner: AllureAdapter + AllureStepBuffer
    expected: Steps logged before Allure exposes a current test case are buffered and then published as normal execution steps.
    observed: The generated Allure result is parsed for a pre-case buffered step and its step-level parameter.
    repairHint: Keep pre-case StepLogger events inside AllureStepBuffer and flush them when the Allure lifecycle becomes active.
  - id: core.contract-narrative.base-ui-runtime-suite
    kind: suite
    profile: UI_SUPPORT_CONTRACT
    area: UI_SUPPORT
    capability: Base UI runtime contract
    purpose: Validate UI base-class lifecycle and reporting boundaries.
    reportHint: Repair BaseTestUI setup, teardown, or reporting ownership leakage.
  - id: core.contract-narrative.base-ui-runtime-class
    kind: contract
    area: UI_SUPPORT
    owner: BaseTestUI
    expected: BaseTestUI owns only UI engine setup/teardown and listener wiring; reporting lifecycle remains delegated to TestListener and reporting adapters.
    observed: The contract inspects annotations, lifecycle methods, source imports, and DriverManager cleanup state.
    repairHint: "Keep BaseTestUI thin: initialize DriverManager in @BeforeClass, quit it in @AfterClass, and avoid direct ReportingManager/StepLogger orchestration."
  - id: core.contract-narrative.base-ui-runtime-listener-boundary
    kind: contract
    area: UI_SUPPORT
    owner: BaseTestUI listener contract
    expected: BaseTestUI registers the Core TestListener facade while atf-reporting owns reporting lifecycle behavior. Allure is discovered through its native TestNG service.
    observed: The test verifies @Listeners(TestListener.class) and confirms that BaseTestUI does not directly orchestrate ReportingManager or StepLogger.
    repairHint: Keep @Listeners(TestListener.class) on BaseTestUI and provide concrete reporting through atf-reporting.
  - id: core.contract-narrative.base-ui-runtime-lifecycle
    kind: contract
    area: UI_SUPPORT
    owner: BaseTestUI lifecycle contract
    expected: BaseTestUI exposes exactly the framework lifecycle hooks needed for UI engine init and cleanup.
    observed: The test verifies setUp() is @BeforeClass(alwaysRun=true) and tearDown() is @AfterClass(alwaysRun=true).
    repairHint: Keep UI engine lifecycle in class-level setup/teardown so test methods stay business/action oriented.
  - id: core.contract-narrative.ui-engine-action-parity-suite
    kind: suite
    profile: UI_SUPPORT_CONTRACT
    area: UI_ENGINE
    capability: UI engine common action surface
    purpose: Validate that Selenium and Playwright remain adapters behind the same UIEngine contract.
    reportHint: Update UIEngine and both concrete engines together when adding or changing UI actions.
  - id: core.contract-narrative.ui-engine-action-parity-class
    kind: contract
    area: UI_ENGINE
    owner: UIEngine + SeleniumEngine + PlaywrightEngine
    expected: Both UI engines expose the same framework action surface without requiring product UI smoke tests.
    observed: The tests use reflection to validate the public UIEngine surface and concrete adapter boundary.
    repairHint: Keep UIEngine as the canonical contract and avoid adding actions to only one concrete engine.
  - id: core.contract-narrative.ui-engine-action-parity-interface-surface
    kind: contract
    area: UI_ENGINE
    owner: UIEngine interface
    expected: The canonical UIEngine interface exposes every action family used by page/actions/validation layers.
    observed: The test lists method names from UIEngine and compares them with the required action surface.
    repairHint: Add missing action methods to UIEngine first, then implement them in concrete engines.
  - id: core.contract-narrative.ui-engine-action-parity-adapter-boundary
    kind: contract
    area: UI_ENGINE
    owner: Concrete UI engine adapters
    expected: SeleniumEngine and PlaywrightEngine both implement UIEngine so tests do not depend on engine-specific APIs.
    observed: The test validates assignability for both concrete engine classes without launching a browser.
    repairHint: Keep concrete engines behind UIEngine and do not expose driver/page APIs to test classes.
  - id: core.contract-narrative.ui-engine-delegation-suite
    kind: suite
    profile: UI_SUPPORT_CONTRACT
    area: UI_ENGINE
    capability: UI action delegation and network evidence
    purpose: Validate that UIActions stays browser-adapter agnostic while preserving bounded network proof.
    reportHint: Route UI scenarios through UIActions and keep browser-specific objects out of test code.
  - id: core.contract-narrative.ui-engine-delegation-actions
    kind: contract
    area: UI_ENGINE
    owner: UIActions + DriverManager + UIEngine
    expected: Framework-level UI actions delegate to the active UIEngine instead of bypassing the browser abstraction.
    observed: A recording fake engine is installed in DriverManager and UIActions calls are checked against the recorded engine operations.
    repairHint: Keep test/page/action layers routed through UIActions and DriverManager.getEngine(), not direct Selenium or Playwright APIs.
  - id: core.contract-narrative.ui-engine-delegation-network-response
    kind: contract
    area: UI_ENGINE
    owner: UiNetworkResponse
    expected: Network evidence is immutable, bounded, and useful for UI-triggered request assertions without dumping large or sensitive payloads.
    observed: The test builds a response with a long body and checks method normalization, success classification, URL matching, and body preview bounds.
    repairHint: Keep UiNetworkResponse as a small value object; do not expose mutable Playwright/Selenium response objects to tests.
  - id: core.contract-narrative.framework-runtime-ui-defaults-suite
    kind: suite
    profile: UI_SUPPORT_CONTRACT
    area: UI_ENGINE
    capability: Runtime UI defaults
    purpose: Validate the canonical UI runtime defaults from framework.properties without launching a browser.
    reportHint: Repair atf-core/src/main/resources/framework.properties and update the documented UI runtime contract together.
  - id: core.contract-narrative.framework-runtime-ui-defaults-class
    kind: contract
    area: UI_ENGINE
    owner: framework.properties
    expected: The project default UI runtime is Playwright headless, fullscreen, zoom=60, and final-state screenshots enabled.
    observed: The test reads atf-core/src/main/resources/framework.properties directly and compares only the canonical UI defaults.
    repairHint: Keep framework.properties as the runtime source of truth; do not hide default changes inside tests.
  - id: core.contract-narrative.framework-runtime-ui-defaults-properties
    kind: contract
    area: UI_ENGINE
    owner: framework.properties
    expected: Canonical UI defaults are declared in framework.properties, not inferred from individual tests.
    observed: The test loads the file from disk and publishes the exact key/value comparison.
    repairHint: Update framework.properties or the documented contract together; never patch defaults in a single UI test.
  - id: core.contract-narrative.ui-core-config-override-suite
    kind: suite
    profile: UI_SUPPORT_CONTRACT
    area: UI_ENGINE
    capability: UI config override discipline
    purpose: Validate that UI core tests may override ui.headless only when they restore the runtime value.
    reportHint: Add @AfterMethod restore logic or a dedicated helper before introducing new ConfigManager.set("ui.headless", ...) calls.
